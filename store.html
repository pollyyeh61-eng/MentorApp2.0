<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUXE Inventory | 黑金奢華庫存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --light-gold: #fcf6ba; --black: #050505; }
        .luxury-back-btn { position: fixed; top: 15px; left: 15px; z-index: 9999; display: flex; align-items: center; gap: 8px; padding: 8px 15px; background: rgba(5, 5, 5, 0.85); border: 1px solid var(--gold); border-radius: 30px; color: var(--light-gold); text-decoration: none; font-size: 13px; font-weight: bold; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px); }
        body { background-color: var(--black); color: #e0e0e0; font-family: 'Noto Sans TC', sans-serif; background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%); min-height: 100vh; margin: 0; }
        .gold-text { font-family: 'Cinzel', serif; background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-btn { padding: 10px 20px; color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 2px; transition: all 0.4s; background: none; cursor: pointer; border: 1px solid transparent; }
        .nav-btn.active { color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.3); background: rgba(212, 175, 55, 0.1); }
        .luxury-card { background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(15px); animation: breathe 4s infinite ease-in-out; }
        @keyframes breathe {
            0%, 100% { border-color: rgba(212, 175, 55, 0.2); box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); filter: brightness(1); }
            50% { border-color: rgba(212, 175, 55, 0.6); box-shadow: 0 0 25px rgba(212, 175, 55, 0.2); filter: brightness(1.15); }
        }
        input, select { background: rgba(0,0,0,0.6) !important; border: 1px solid rgba(212, 175, 55, 0.2) !important; color: #fff !important; outline: none; }
        .gold-btn-main { background: linear-gradient(135deg, #b38728, #fcf6ba, #aa771c) !important; color: #000 !important; font-weight: 900; letter-spacing: 4px; cursor: pointer; }
    </style>
</head>
<body>

<a href="index.html" class="luxury-back-btn"><span>🏠</span> 返回首頁</a>

<div id="app" class="p-6 md:p-12 pt-20"> 
    <header class="flex flex-col md:flex-row justify-between items-center mb-16 gap-8">
        <h1 class="text-4xl gold-text font-bold tracking-[0.2em]">LUXE INVENTORY</h1>
        <nav class="flex gap-2">
            <button @click="page = 1" :class="['nav-btn', {active: page === 1}]">資料輸入</button>
            <button @click="page = 2" :class="['nav-btn', {active: page === 2}]">倉庫抽屜</button>
            <button @click="page = 3" :class="['nav-btn', {active: page === 3}]">營運建議</button>
        </nav>
    </header>

    <main>
        <section v-if="page === 1" class="max-w-xl mx-auto">
            <div class="luxury-card p-10 rounded-3xl border-t-2 border-t-gold/50">
                <h2 class="text-xl gold-text mb-8 tracking-[5px] text-center">ITEM REGISTRATION</h2>
                <div class="space-y-6 text-sm">
                    <div>
                        <label class="block opacity-40 mb-2">物品名稱 / Name</label>
                        <input v-model="newItem.name" type="text" class="w-full p-4 rounded-xl">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block opacity-40 mb-2">類別 / Category</label>
                            <select v-model="newItem.category" class="w-full p-4 rounded-xl">
                                <option value="藥劑">藥劑/染劑</option>
                                <option value="耗材">備品耗材</option>
                                <option value="奢華">精品客供</option>
                            </select>
                        </div>
                        <div>
                            <label class="block opacity-40 mb-2">當前存量</label>
                            <input v-model.number="newItem.stock" type="number" class="w-full p-4 rounded-xl">
                        </div>
                    </div>
                    <div>
                        <label class="block opacity-40 mb-2">安全水位 / Safety Line</label>
                        <input v-model.number="newItem.safeValue" type="number" class="w-full p-4 rounded-xl">
                    </div>
                    <button @click="addItem" class="gold-btn-main w-full py-5 mt-4 rounded-xl active:scale-95 transition-transform">
                        存入金庫系統
                    </button>
                </div>
            </div>
        </section>

        <section v-if="page === 2">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <div v-for="item in items" :key="item.id" class="luxury-card p-6 rounded-2xl h-60 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-[9px] text-gold border border-gold/30 px-2 py-1 rounded">{{ item.category }}</span>
                            <span v-if="item.stock <= item.safeValue" class="text-red-500 text-[9px] font-bold animate-pulse">REFILL</span>
                        </div>
                        <h3 class="text-xl mt-4 tracking-wider text-white">{{ item.name }}</h3>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="text-4xl font-light text-white">{{ item.stock }}<span class="text-xs opacity-30 ml-1">U</span></div>
                        <div class="flex gap-2">
                            <button @click="updateStock(item, -1)" class="w-10 h-10 border border-gold/30 rounded-lg text-gold hover:bg-gold hover:text-black">－</button>
                            <button @click="updateStock(item, 1)" class="w-10 h-10 border border-gold/30 rounded-lg text-gold hover:bg-gold hover:text-black">＋</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section v-if="page === 3" class="max-w-6xl mx-auto space-y-8">
            <div class="flex justify-end">
                <button @click="downloadCombinedReport" class="px-6 py-2 border border-gold text-[10px] text-gold hover:bg-gold hover:text-black tracking-[2px]">EXPORT REPORT</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div v-for="type in reportLogic" :key="type.title" class="luxury-card p-6 rounded-2xl border-t-4" :style="{borderColor: type.color}">
                    <h4 class="text-xs font-bold mb-4" :style="{color: type.color}">{{ type.title }}</h4>
                    <div class="space-y-2 h-40 overflow-y-auto pr-2 text-xs">
                        <div v-for="i in type.list" :key="i.id" class="flex justify-between border-b border-white/5 pb-2">
                            <span>{{ i.name }}</span>
                            <span>{{ i.stock }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
        authDomain: "holyhairsalon-f73bf.firebaseapp.com",
        projectId: "holyhairsalon-f73bf",
        storageBucket: "holyhairsalon-f73bf.firebasestorage.app",
        messagingSenderId: "960169055224",
        appId: "1:960169055224:web:02407a24022a6fb0bf3c0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            const page = ref(1);
            const items = ref([]);
            const newItem = ref({ name: '', category: '藥劑', stock: 0, safeValue: 5 });

            onMounted(() => {
                onSnapshot(collection(db, "inventory"), (snap) => {
                    items.value = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                });
            });

            const addItem = async () => {
                if (!newItem.value.name) return alert("請輸入名稱");
                try {
                    await addDoc(collection(db, "inventory"), {
                        name: newItem.value.name,
                        category: newItem.value.category,
                        stock: Number(newItem.value.stock),
                        safeValue: Number(newItem.value.safeValue),
                        updatedAt: Date.now()
                    });
                    alert("✨ 已安全存入金庫");
                    newItem.value = { name: '', category: '藥劑', stock: 0, safeValue: 5 };
                } catch (e) {
                    console.error(e);
                    alert("存入失敗！\n原因：可能是 Firebase Firestore 規則未開啟。請務必將規則設為 allow read, write: if true;");
                }
            };

            const updateStock = async (item, change) => {
                const newStock = Math.max(0, item.stock + change);
                await updateDoc(doc(db, "inventory", item.id), { stock: newStock });
            };

            const reportLogic = computed(() => [
                { title: '🆘 補貨', color: '#ff4d4d', list: items.value.filter(i => i.stock <= i.safeValue) },
                { title: '✅ 正常', color: '#d4af37', list: items.value.filter(i => i.stock > i.safeValue && i.stock <= i.safeValue * 2) },
                { title: '📈 充裕', color: '#4da6ff', list: items.value.filter(i => i.stock > i.safeValue * 2 && i.stock <= i.safeValue * 3) },
                { title: '🔥 過量', color: '#ff944d', list: items.value.filter(i => i.stock > i.safeValue * 3) }
            ]);

            const downloadCombinedReport = () => {
                let txt = "LUXE REPORT\n\n";
                items.value.forEach(i => txt += `${i.name}: ${i.stock}\n`);
                const blob = new Blob(["\ufeff" + txt], { type: "text/plain;charset=utf-8" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `Report.txt`;
                a.click();
            };

            return { page, items, newItem, addItem, updateStock, reportLogic, downloadCombinedReport };
        }
    }).mount('#app');
</script>
</body>
</html>
