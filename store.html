<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE Inventory | 黑金奢華庫存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --light-gold: #fcf6ba;
            --dark-gold: #926f34;
            --black: #050505;
        }

        body {
            background-color: var(--black);
            color: #e0e0e0;
            font-family: 'Noto Sans TC', sans-serif;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            min-height: 100vh;
            margin: 0;
        }

        .gold-text {
            font-family: 'Cinzel', serif;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 精緻化按鈕設計 */
        .nav-btn {
            position: relative;
            padding: 10px 20px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            overflow: hidden;
            background: none;
            cursor: pointer;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            bottom: 0; left: 50%; width: 0; height: 1px;
            background: var(--gold);
            transition: all 0.4s ease;
        }

        .nav-btn:hover {
            color: var(--light-gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .nav-btn.active {
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(212, 175, 55, 0.1);
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .nav-btn.active::before { width: 100%; left: 0; }

        /* 呼吸感卡片與反光 */
        .luxury-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            animation: breathe 6s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 15px rgba(0,0,0,0.5); border-color: rgba(212, 175, 55, 0.15); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.1); border-color: rgba(212, 175, 55, 0.4); }
        }

        .luxury-card::after {
            content: '';
            position: absolute;
            top: -150%; left: -150%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.08), transparent);
            transform: rotate(45deg);
            pointer-events: none;
        }

        .luxury-card:hover::after {
            left: 150%; top: 150%;
            transition: 0.8s;
        }

        /* 輸入框美化 */
        input, select {
            background: rgba(0,0,0,0.4) !important;
            border: 1px solid rgba(212, 175, 55, 0.2) !important;
            color: #fff !important;
            transition: 0.3s;
            outline: none;
        }
        input:focus { border-color: var(--gold) !important; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .gold-btn-main {
            background: linear-gradient(135deg, #b38728, #fcf6ba, #aa771c);
            color: #000;
            font-weight: 700;
            letter-spacing: 4px;
            transition: 0.4s;
            cursor: pointer;
            border: none;
        }
        .gold-btn-main:hover { transform: scale(1.02); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

        /* 隱藏捲軸 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--dark-gold); border-radius: 10px; }
    </style>
</head>
<body>

<div id="app" class="p-6 md:p-12">
    <header class="flex flex-col md:flex-row justify-between items-center mb-16 gap-8 text-center md:text-left">
        <h1 class="text-4xl gold-text font-bold tracking-[0.2em]">LUXE INVENTORY</h1>
        <div class="flex items-center gap-4 flex-wrap justify-center">
            <nav class="flex gap-2">
                <button @click="page = 1" :class="['nav-btn', {active: page === 1}]">資料輸入</button>
                <button @click="page = 2" :class="['nav-btn', {active: page === 2}]">倉庫抽屜</button>
                <button @click="page = 3" :class="['nav-btn', {active: page === 3}]">營運建議</button>
            </nav>
            <button @click="downloadCombinedReport" class="px-6 py-2 border border-gold text-[10px] text-gold hover:bg-gold hover:text-black transition-all tracking-[2px] bg-transparent cursor-pointer">
                MERGED REPORT
            </button>
        </div>
    </header>

    <main>
        <section v-if="page === 1" class="max-w-xl mx-auto">
            <div class="luxury-card p-10 rounded-3xl border-t-2 border-t-gold/50">
                <h2 class="text-xl gold-text mb-8 tracking-[5px] text-center">ITEM REGISTRATION</h2>
                <div class="space-y-6 text-sm">
                    <div>
                        <label class="block opacity-40 mb-2">物品名稱 / Name</label>
                        <input v-model="newItem.name" type="text" class="w-full p-4 rounded-xl">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block opacity-40 mb-2">類別 / Category</label>
                            <select v-model="newItem.category" class="w-full p-4 rounded-xl">
                                <option value="藥劑">藥劑/染劑</option>
                                <option value="耗材">備品耗材</option>
                                <option value="奢華">精品客供</option>
                            </select>
                        </div>
                        <div>
                            <label class="block opacity-40 mb-2">當前存量</label>
                            <input v-model.number="newItem.stock" type="number" class="w-full p-4 rounded-xl">
                        </div>
                    </div>
                    <div>
                        <label class="block opacity-40 mb-2">安全水位 / Safety Line</label>
                        <input v-model.number="newItem.safeValue" type="number" class="w-full p-4 rounded-xl">
                    </div>
                    <button @click="addItem" class="gold-btn-main w-full py-5 mt-4 rounded-xl">存入金庫系統</button>
                </div>
            </div>
        </section>

        <section v-if="page === 2">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <div v-for="item in items" :key="item.id" class="luxury-card p-6 rounded-2xl h-60 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between">
                            <span class="text-[9px] text-gold border border-gold/30 px-2 py-1 rounded">{{ item.category }}</span>
                            <span v-if="item.stock <= item.safeValue" class="text-red-500 text-[9px] font-bold animate-pulse">REFILL NEEDED</span>
                        </div>
                        <h3 class="text-xl mt-4 tracking-wider">{{ item.name }}</h3>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="text-4xl font-light text-white">{{ item.stock }}<span class="text-xs opacity-30 ml-1">UNITS</span></div>
                        <div class="flex gap-2">
                            <button @click="updateStock(item, -1)" class="w-10 h-10 border border-gold/30 rounded-lg hover:bg-gold hover:text-black transition-all bg-transparent cursor-pointer">－</button>
                            <button @click="updateStock(item, 1)" class="w-10 h-10 border border-gold/30 rounded-lg hover:bg-gold hover:text-black transition-all bg-transparent cursor-pointer">＋</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section v-if="page === 3" class="max-w-6xl mx-auto space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div v-for="type in reportLogic" :key="type.title" class="luxury-card p-6 rounded-2xl border-t-4" :style="{borderColor: type.color}">
                    <h4 class="text-xs font-bold mb-4" :style="{color: type.color}">{{ type.title }}</h4>
                    <div class="space-y-2 h-40 overflow-y-auto pr-2">
                        <div v-for="i in type.list" :key="i.id" class="flex justify-between text-xs border-b border-white/5 pb-2">
                            <span>{{ i.name }}</span>
                            <span class="opacity-60">{{ i.stock }}件</span>
                        </div>
                    </div>
                    <p class="mt-4 text-[10px] opacity-50 italic">建議：{{ type.advice }}</p>
                </div>
            </div>
            
            <div class="luxury-card p-10 rounded-3xl text-center">
                <h3 class="gold-text text-xl mb-6 tracking-[8px]">BUSINESS ANALYSIS</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div><p class="text-[10px] opacity-40 mb-1">今日總額</p><p class="text-2xl gold-text font-bold">$12,800</p></div>
                    <div><p class="text-[10px] opacity-40 mb-1">客單分析</p><p class="text-2xl gold-text font-bold">$2,560</p></div>
                    <div><p class="text-[10px] opacity-40 mb-1">銷售佔比</p><p class="text-2xl gold-text font-bold">18.5%</p></div>
                </div>
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- 請記得替換成你的 Firebase 設定 ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            const page = ref(2);
            const items = ref([]);
            const newItem = ref({ name: '', category: '藥劑', stock: 0, safeValue: 5 });

            onMounted(() => {
                onSnapshot(query(collection(db, "inventory")), (snap) => {
                    items.value = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                });
            });

            const addItem = async () => {
                if (!newItem.value.name) {
                    alert("請輸入名稱");
                    return;
                }
                await addDoc(collection(db, "inventory"), newItem.value);
                newItem.value = { name: '', category: '藥劑', stock: 0, safeValue: 5 };
                alert("物品已安全存入庫存系統");
            };

            const updateStock = async (item, change) => {
                const newStock = Math.max(0, item.stock + change);
                await updateDoc(doc(db, "inventory", item.id), { stock: newStock });
            };

            const reportLogic = computed(() => [
                { title: '🆘 不足量補貨', color: '#ff4d4d', advice: '請儘快補貨，避免斷貨風險。', 
                  list: items.value.filter(i => i.stock <= i.safeValue) },
                { title: '✅ 均量保持', color: '#d4af37', advice: '現狀良好，暫無需變動。', 
                  list: items.value.filter(i => i.stock > i.safeValue && i.stock <= i.safeValue * 2) },
                { title: '📈 主力推薦', color: '#4da6ff', advice: '過量一倍，建議列為本週主力推薦品項。', 
                  list: items.value.filter(i => i.stock > i.safeValue * 2 && i.stock <= i.safeValue * 3) },
                { title: '🔥 促銷處理', color: '#ff944d', advice: '過量二倍以上，建議立即執行促銷活動。', 
                  list: items.value.filter(i => i.stock > i.safeValue * 3) }
            ]);

            const downloadCombinedReport = () => {
                const now = new Date();
                let content = `【 LUXE MANAGEMENT - 綜合營運庫存月結報告 】\n`;
                content += `產出時間: ${now.toLocaleString()}\n${'='.repeat(60)}\n\n`;

                content += `[ 第一部分：全庫存狀態清冊 ]\n`;
                items.value.forEach(i => {
                    content += `- ${i.name.padEnd(15)} | 分類: ${i.category} | 當前庫存: ${i.stock} | 安全水位: ${i.safeValue}\n`;
                });

                content += `\n\n[ 第二部分：營運階梯建議報告 ]\n`;
                reportLogic.value.forEach(type => {
                    content += `\n▶ ${type.title} (共 ${type.list.length} 項)\n`;
                    content += `建議方針：${type.advice}\n`;
                    type.list.forEach(i => content += `   - ${i.name} (庫存:${i.stock})\n`);
                });

                content += `\n\n[ 第三部分：每日結算摘要 ]\n- 今日預估業績: $12,800\n- 平均客單價: $2,560\n- 產品銷售比例: 18.5%\n`;
                
                const blob = new Blob(["\ufeff" + content], { type: "text/plain;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `LUXE_Full_Report_${now.getTime()}.txt`;
                a.click();
            };

            return { page, items, newItem, addItem, updateStock, reportLogic, downloadCombinedReport };
        }
    }).mount('#app');
</script>

</body>
</html>
