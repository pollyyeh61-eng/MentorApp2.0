<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美業升等集點卡 - SDK 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 45%, #B38728 70%, #FBF5B7 85%, #AA771C 100%); 
            --dark-bg: #050505; 
        }

        .luxury-back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 9999;
            display: flex; align-items: center; gap: 8px; padding: 10px 18px;
            background: rgba(5, 5, 5, 0.8); border: 1px solid #BF953F;
            border-radius: 30px; color: #FCF6BA; text-decoration: none;
            font-size: 0.85rem; font-family: 'Cinzel', serif; font-weight: bold;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.2); backdrop-filter: blur(15px);
        }

        body { 
            background-color: var(--dark-bg); color: #D4D4D4; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #050505 100%); 
            min-height: 100vh; padding-top: 60px; padding-bottom: 90px; 
        }

        .gold-text-fancy { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Cinzel', serif; letter-spacing: 0.15em; font-weight: 700; }
        .gold-text-btn { color: #BF953F; font-weight: 600; letter-spacing: 0.1em; }
        .luxury-card { background: rgba(20, 20, 20, 0.7); border: 1px solid rgba(191, 149, 63, 0.15); backdrop-filter: blur(25px); border-radius: 28px; }
        
        input, select { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(191, 149, 63, 0.2); color: white; padding: 12px; border-radius: 12px; outline: none; }
        .btn-luxury { background: rgba(0, 0, 0, 0.6); border: 1px solid #8A6E2F; border-radius: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .stamp-slot { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(191, 149, 63, 0.15); display: flex; align-items: center; justify-content: center; font-size: 10px; background: rgba(255,255,255,0.02); }
        .stamp-active { background: var(--gold-gradient); color: #000; border: none; box-shadow: 0 0 15px rgba(191, 149, 63, 0.4); }
        
        .filter-tab { font-size: 10px; padding: 8px 12px; border-radius: 20px; border: 1px solid rgba(191,149,63,0.2); color: #666; }
        .filter-tab.active { background: var(--gold-gradient); color: #000; font-weight: bold; }

        .hidden-card { display: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(5,5,5,0.95); border-top: 1px solid rgba(191, 149, 63, 0.2); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { font-size: 11px; color: #555; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #BF953F; }
    </style>
</head>
<body class="px-5">

    <a href="index.html" class="luxury-back-btn"><span>🏠</span> 返回首頁</a>

    <div id="page-member" class="page-content py-6">
        <header class="text-center mb-6">
            <h1 class="text-3xl gold-text-fancy mb-1">美業升等集點卡</h1>
            <p class="text-[9px] tracking-[0.5em] text-gray-600 uppercase">Premium Cloud System</p>
        </header>

        <section class="luxury-card p-6 mb-4">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="reg-name" placeholder="顧客姓名">
                    <input type="tel" id="reg-phone" placeholder="電話確認">
                </div>
                <p id="search-status" class="text-[10px] text-center text-gray-500 italic">請輸入姓名或點擊倉庫選取...</p>
                <button id="main-action-btn" class="w-full btn-luxury py-3">
                    <span class="gold-text-btn">搜尋/建立會員卡</span>
                </button>
            </div>
        </section>

        <div id="data-display-area" class="hidden-card">
            <section class="luxury-card p-6 mb-4">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span id="display-card-id" class="text-[10px] text-gray-500 font-mono">ID: ---</span>
                        <h2 id="display-name" class="text-2xl font-bold text-white mt-1">---</h2>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-500 mb-1">票券餘額</div>
                        <div class="flex gap-2">
                            <span id="ticket-cut" class="bg-blue-900/20 text-blue-400 px-2 py-1 rounded text-[10px] border border-blue-800/30">剪: 0</span>
                            <span id="ticket-wash" class="bg-purple-900/20 text-purple-400 px-2 py-1 rounded text-[10px] border border-purple-800/30">洗: 0</span>
                        </div>
                    </div>
                </div>
                <div class="stamp-grid" id="stamp-container"></div>
            </section>

            <section class="luxury-card p-5 space-y-4">
                <div class="flex gap-2">
                    <select id="buy-type" class="flex-grow text-xs">
                        <option value="haircut">購買剪髮10次卡</option>
                        <option value="wash">購買洗髮10次卡</option>
                    </select>
                    <button id="btnBuy" class="btn-luxury px-6"><span class="gold-text-btn">購買</span></button>
                </div>
                <button id="btnCheckOut" class="w-full btn-luxury py-4"><span class="gold-text-btn">完成結帳 (累計1點)</span></button>
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/5">
                    <button onclick="handleRedeem('stamps')" class="btn-luxury py-2 border-yellow-900/20"><span class="text-yellow-500 text-[10px]">核銷集點</span></button>
                    <button onclick="handleRedeem('haircut')" class="btn-luxury py-2 border-blue-900/20"><span class="text-blue-400 text-[10px]">核銷剪髮</span></button>
                    <button onclick="handleRedeem('wash')" class="btn-luxury py-2 border-purple-900/20"><span class="text-purple-400 text-[10px]">核銷洗髮</span></button>
                </div>
            </section>
        </div>
    </div>

    <div id="page-list" class="page-content py-6 hidden">
        <header class="text-center mb-6">
            <h1 class="text-2xl gold-text-fancy mb-4">會員倉庫</h1>
            <input type="text" id="search-input" placeholder="🔍 搜尋姓名或電話..." class="w-full text-xs mb-4">
        </header>
        <div id="member-directory" class="space-y-4 pb-24"></div>
    </div>

    <nav class="bottom-nav">
        <button onclick="switchPage('member')" id="nav-member" class="nav-item active"><span>⬡</span><span>操作面板</span></button>
        <button onclick="switchPage('list')" id="nav-list" class="nav-item"><span>☷</span><span>名單倉庫</span></button>
    </nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc",
        authDomain: "mentor-app-b76e3.firebaseapp.com",
        projectId: "mentor-app-b76e3",
        storageBucket: "mentor-app-b76e3.firebasestorage.app",
        messagingSenderId: "757249551762",
        appId: "1:757249551762:web:512533e0a85dc1ad47654b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeUserDocId = "";

    // 1. 搜尋或建立會員
    async function handleMainAction() {
        const name = document.getElementById('reg-name').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        if (!name) return alert("請輸入姓名");

        const q = query(collection(db, "stamp_members"), where("name", "==", name));
        const snap = await getDocs(q);

        if (!snap.empty) {
            // 找到會員
            const memberDoc = snap.docs[0];
            activeUserDocId = memberDoc.id;
            loadMemberUI(memberDoc.id);
            document.getElementById('search-status').innerText = "✅ 已找到雲端資料";
        } else {
            // 建立新會員
            if (!phone) return alert("新會員請輸入電話以利後續辨識");
            const newDoc = await addDoc(collection(db, "stamp_members"), {
                name, phone, stamps: 0, haircut_tickets: 0, wash_tickets: 0, lastUpdate: new Date()
            });
            activeUserDocId = newDoc.id;
            loadMemberUI(newDoc.id);
            document.getElementById('search-status').innerText = "✨ 已建立新會員卡";
        }
    }

    // 2. 監聽會員資料並更新 UI
    function loadMemberUI(docId) {
        document.getElementById('data-display-area').classList.remove('hidden-card');
        onSnapshot(doc(db, "stamp_members", docId), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('display-name').innerText = data.name;
                document.getElementById('display-card-id').innerText = `ID: ${docId.slice(0,6)}`;
                document.getElementById('ticket-cut').innerText = `剪: ${data.haircut_tickets}`;
                document.getElementById('ticket-wash').innerText = `洗: ${data.wash_tickets}`;
                
                const container = document.getElementById('stamp-container');
                container.innerHTML = "";
                for(let i=1; i<=10; i++) {
                    container.innerHTML += `<div class="stamp-slot ${i <= data.stamps ? 'stamp-active' : ''}">${i <= data.stamps ? '✦' : i}</div>`;
                }
            }
        });
    }

    // 3. 結帳 (累計點數)
    window.handleCheckOut = async () => {
        if (!activeUserDocId) return;
        await updateDoc(doc(db, "stamp_members", activeUserDocId), {
            stamps: increment(1),
            lastUpdate: new Date()
        });
        alert("結帳成功，點數已累計");
    };

    // 4. 購買票券
    window.handleBuyTicket = async () => {
        if (!activeUserDocId) return;
        const type = document.getElementById('buy-type').value;
        const updateData = { lastUpdate: new Date() };
        if (type === 'haircut') updateData.haircut_tickets = increment(10);
        else updateData.wash_tickets = increment(10);
        
        await updateDoc(doc(db, "stamp_members", activeUserDocId), updateData);
        alert("購買成功！");
    };

    // 5. 核銷功能
    window.handleRedeem = async (mode) => {
        if (!activeUserDocId) return;
        const userRef = doc(db, "stamp_members", activeUserDocId);
        if (mode === 'stamps') {
            await updateDoc(userRef, { stamps: 0 });
            alert("集點禮已核銷");
        } else if (mode === 'haircut') {
            await updateDoc(userRef, { haircut_tickets: increment(-1) });
            alert("已核銷 1 次剪髮");
        } else if (mode === 'wash') {
            await updateDoc(userRef, { wash_tickets: increment(-1) });
            alert("已核銷 1 次洗髮");
        }
    };

    // 6. 名單倉庫渲染
    function renderDirectory() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
        onSnapshot(collection(db, "stamp_members"), (snapshot) => {
            const container = document.getElementById('member-directory');
            container.innerHTML = "";
            snapshot.forEach(docSnap => {
                const m = docSnap.data();
                if (m.name.includes(keyword) || m.phone.includes(keyword)) {
                    const item = document.createElement('div');
                    item.className = "luxury-card p-4 flex justify-between items-center";
                    item.innerHTML = `
                        <div>
                            <span class="gold-text-btn">${m.name}</span>
                            <div class="text-[10px] text-gray-500">${m.phone}</div>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[9px] text-blue-400">剪: ${m.haircut_tickets}</span>
                                <span class="text-[9px] text-purple-400">洗: ${m.wash_tickets}</span>
                                <span class="text-[9px] text-yellow-500">點: ${m.stamps}</span>
                            </div>
                        </div>
                        <button onclick="selectMember('${docSnap.id}', '${m.name}', '${m.phone}')" class="text-[10px] gold-text-btn border border-gold px-4 py-1 rounded-full">選取</button>
                    `;
                    container.appendChild(item);
                }
            });
        });
    }

    window.selectMember = (id, name, phone) => {
        document.getElementById('reg-name').value = name;
        document.getElementById('reg-phone').value = phone;
        activeUserDocId = id;
        loadMemberUI(id);
        switchPage('member');
    };

    // 頁面切換
    window.switchPage = (pid) => {
        document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
        document.getElementById(`page-${pid}`).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`nav-${pid}`).classList.add('active');
        if(pid === 'list') renderDirectory();
    };

    document.getElementById('main-action-btn').onclick = handleMainAction;
    document.getElementById('btnBuy').onclick = handleBuyTicket;
    document.getElementById('btnCheckOut').onclick = handleCheckOut;
    document.getElementById('search-input').oninput = renderDirectory;
</script>

</body>
</html>
