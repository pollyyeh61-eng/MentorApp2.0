<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尊榮管理 - SDK 雲端版</title>
    <style>
        :root {
            --bg-dark: #050505; --card-bg: #121212;
            --gold-light: #f1c40f; --gold-dark: #7a5c0d;
            --text-main: #e0e0e0; 
            --btn-save: #00ff88; --btn-edit: #00d4ff; --btn-delete: #ff4d4d;
        }

        .luxury-back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 9999;
            display: flex; align-items: center; gap: 8px; padding: 10px 18px;
            background: rgba(8, 8, 8, 0.8); border: 1px solid #D4AF37;
            border-radius: 30px; color: #D4AF37; text-decoration: none;
            font-size: 0.9rem; font-weight: bold; backdrop-filter: blur(10px);
        }

        body { 
            font-family: 'PingFang TC', sans-serif; background: var(--bg-dark); 
            color: var(--text-main); padding: 15px; padding-top: 80px; 
            display: flex; flex-direction: column; align-items: center; margin: 0; 
        }

        .container { width: 100%; max-width: 450px; background: var(--card-bg); padding: 25px; border-radius: 28px; border: 1px solid var(--gold-dark); box-sizing: border-box; }
        h1 { color: var(--gold-light); text-align: center; }
        label { display: block; margin-top: 15px; font-size: 0.8rem; color: #888; }
        input, select { width: 100%; padding: 14px; margin-top: 8px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; }
        
        .transaction-type { display: flex; gap: 10px; margin-top: 20px; }
        .transaction-type label { flex: 1; padding: 12px; background: #222; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid transparent; }
        .transaction-type input { display: none; }
        .transaction-type label:has(input:checked) { border-color: var(--gold-light); color: var(--gold-light); background: #2d2d2d; }
        
        .btn-save { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: bold; background: linear-gradient(135deg, #008f4f, #00ff88); margin-top: 25px; cursor: pointer; }

        .member-card { background: #1a1a1a; border-radius: 20px; margin-top: 18px; border: 1px solid #333; padding: 20px; position: relative; }
        .rank-badge { position: absolute; right: 0; top: 0; background: var(--gold-light); color: #000; padding: 5px 12px; border-radius: 0 0 0 15px; font-size: 0.7rem; font-weight: 900; }
        .balance-tag { font-size: 1.6rem; font-weight: 800; color: var(--gold-light); }
        .status-msg { position: fixed; top: 20px; background: var(--gold-light); color: #000; padding: 10px 30px; border-radius: 30px; display: none; z-index: 10000; font-weight: bold; }
    </style>
</head>
<body>

<a href="index.html" class="luxury-back-btn"><span>🏠</span> 返回首頁</a>
<div id="status" class="status-msg">同步成功</div>

<div class="container">
  <h1>尊榮會員管理</h1>
  <form id="memberForm">
    <label>手機號碼</label>
    <input type="tel" id="phone" placeholder="搜尋或新增手機..." autocomplete="off">
    
    <label>會員姓名</label>
    <input type="text" id="name" placeholder="輸入姓名..." required>
    
    <label>會員等級</label>
    <select id="level">
      <option value="普通會員">普通會員</option>
      <option value="VIP 尊爵">VIP 尊爵</option>
      <option value="白金金鑽">白金金鑽</option>
      <option value="黃金銀鑽">黃金銀鑽</option>
    </select>

    <label>本次金額</label>
    <input type="number" id="amount" value="0">
    
    <div class="transaction-type">
      <label><input type="radio" name="transType" value="deposit" checked> 💰 儲值</label>
      <label><input type="radio" name="transType" value="spend"> ✂️ 退費</label>
    </div>

    <label>備註</label>
    <input type="text" id="note" placeholder="記錄項目...">
    
    <button type="button" class="btn-save" id="submitBtn">✨ 提交數據至雲端</button>
  </form>

  <hr style="border:0; border-top:1px solid #222; margin: 30px 0;">
  <h2>📊 雲端檔案庫</h2>
  <div id="memberList">載入中...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, where, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc",
        authDomain: "mentor-app-b76e3.firebaseapp.com",
        projectId: "mentor-app-b76e3",
        storageBucket: "mentor-app-b76e3.firebasestorage.app",
        messagingSenderId: "757249551762",
        appId: "1:757249551762:web:512533e0a85dc1ad47654b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1. 安全檢查：未登入者踢回首頁
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            alert("驗證逾期，請重新登入");
            window.location.href = "index.html";
        } else {
            loadMembers(); // 登入成功才載入資料
        }
    });

    // 2. 處理儲存/更新
    window.handleSave = async function() {
        const phone = document.getElementById('phone').value.trim();
        const name = document.getElementById('name').value.trim();
        const level = document.getElementById('level').value;
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const type = document.querySelector('input[name="transType"]:checked').value;
        const note = document.getElementById('note').value;

        if (!phone || !name) return alert("手機與姓名為必填");

        const finalAmount = type === 'deposit' ? amount : -amount;

        try {
            // 先查詢是否有此手機號碼的會員
            const q = query(collection(db, "members"), where("phone", "==", phone));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                // 更新現有會員
                const memberDoc = querySnapshot.docs[0];
                await updateDoc(doc(db, "members", memberDoc.id), {
                    balance: increment(finalAmount),
                    name: name,
                    level: level,
                    lastUpdate: new Date()
                });
            } else {
                // 新增會員
                await addDoc(collection(db, "members"), {
                    phone, name, level, 
                    balance: finalAmount, 
                    lastUpdate: new Date()
                });
            }

            showStatus("數據已同步");
            document.getElementById('memberForm').reset();
        } catch (e) {
            console.error(e);
            alert("同步失敗，請檢查權限");
        }
    };

    // 3. 實時監控會員清單
    function loadMembers() {
        const q = query(collection(db, "members"));
        onSnapshot(q, (snapshot) => {
            const listDiv = document.getElementById('memberList');
            listDiv.innerHTML = "";
            snapshot.forEach((doc) => {
                const m = doc.data();
                listDiv.innerHTML += `
                    <div class="member-card">
                        <div class="rank-badge">${m.level}</div>
                        <div style="color:#888; font-size:0.8rem;">${m.phone}</div>
                        <div style="font-weight:bold; font-size:1.2rem; margin:5px 0;">${m.name}</div>
                        <div class="balance-tag">$ ${m.balance.toLocaleString()}</div>
                    </div>
                `;
            });
        });
    }

    function showStatus(text) {
        const s = document.getElementById('status');
        s.innerText = text; s.style.display = 'block';
        setTimeout(() => s.style.display = 'none', 2000);
    }

    document.getElementById('submitBtn').onclick = handleSave;
</script>

</body>
</html>
