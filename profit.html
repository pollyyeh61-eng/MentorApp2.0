<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>講師分潤計算 Pro - SDK 雲端版</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-gold: #fbbf24;
            --low-gold: #92400e;
            --bright-gold: #fcd34d;
            --color-sales: #3b82f6;
            --color-score: #10b981;
            --color-new: #f43f5e;
            --color-coop: #8b5cf6;
        }

        body {
            font-family: -apple-system, "微軟正黑體", sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            padding-top: 80px;
            display: flex;
            justify-content: center;
        }

        .btn-back-home {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            display: flex; align-items: center; gap: 8px; padding: 10px 16px;
            background: rgba(30, 41, 59, 0.7); border: 1px solid var(--text-gold);
            border-radius: 50px; color: var(--text-gold); text-decoration: none;
            font-size: 0.9rem; font-weight: bold; backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); transition: all 0.3s ease;
        }

        .btn-back-home:hover {
            background: var(--text-gold); color: var(--bg-dark);
            transform: scale(1.05); box-shadow: 0 0 15px var(--text-gold);
        }

        .app-container { width: 100%; max-width: 450px; }

        @keyframes breathing-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.2); border-color: var(--low-gold); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); border-color: var(--bright-gold); }
        }

        .result-card {
            background: #1e293b; border: 2px solid var(--low-gold);
            border-radius: 24px; padding: 30px; text-align: center;
            margin-bottom: 25px; animation: breathing-glow 4s ease-in-out infinite;
        }

        .total-amount { font-size: 2.5rem; font-weight: 900; color: var(--text-gold); margin: 10px 0; }

        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }

        input, select {
            width: 100%; background: #0f172a; border: 1px solid #334155;
            border-radius: 12px; padding: 14px; color: white; font-size: 1rem;
            box-sizing: border-box; outline: none; transition: all 0.3s ease;
        }

        input:focus { border-color: var(--text-gold); }

        .btn-copy {
            width: 100%; border: none; padding: 16px; border-radius: 14px;
            color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            background-color: #78350f; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-copy:hover { background-color: #d97706; transform: translateY(-2px); }

        .detail-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155;
        }

        .detail-item { text-align: left; font-size: 0.8rem; color: #94a3b8; }
        .detail-item span { display: block; color: #f8fafc; font-size: 1rem; font-weight: 600; margin-top: 4px; }
    </style>
</head>
<body>

<a href="index.html" class="btn-back-home">🏠 返回首頁</a>

<div class="app-container">
    <div class="result-card">
        <div style="color: var(--text-gold); font-size: 0.9rem; letter-spacing: 2px;">ESTIMATED PROFIT</div>
        <div class="total-amount" id="totalProfit">NT$ 0</div>
        
        <div class="detail-grid">
            <div class="detail-item">基礎分潤<span id="det-base">NT$ 0</span></div>
            <div class="detail-item">滿意度獎勵<span id="det-perf">NT$ 0</span></div>
            <div class="detail-item">新客獎勵<span id="det-new">NT$ 0</span></div>
            <div class="detail-item">合作加成<span id="det-coop">NT$ 0</span></div>
        </div>
    </div>

    <div class="card">
        <div class="input-group">
            <label>👤 講師姓名</label>
            <input type="text" id="instructorName" placeholder="請輸入姓名">
        </div>

        <div class="input-group">
            <label>💰 課程銷售總額</label>
            <input type="number" id="salesAmount" value="50000">
        </div>

        <div class="input-group">
            <label>⭐ 學員滿意度 (80分起算獎勵)</label>
            <input type="number" id="satisfactionScore" value="95">
        </div>

        <div class="input-group">
            <label>🚀 新客招募人數</label>
            <input type="number" id="newStudentCount" value="5">
        </div>

        <div class="input-group">
            <label>🤝 合作模式</label>
            <select id="cooperationStatus">
                <option value="false">一般個人開課</option>
                <option value="true">協同合作 (+3%)</option>
            </select>
        </div>

        <button id="btnSaveAndCopy" class="btn-copy">複製並上傳雲端報表</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc",
        authDomain: "mentor-app-b76e3.firebaseapp.com",
        projectId: "mentor-app-b76e3",
        storageBucket: "mentor-app-b76e3.firebasestorage.app",
        messagingSenderId: "757249551762",
        appId: "1:757249551762:web:512533e0a85dc1ad47654b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PARAMS = {
        baseRate: 0.15,
        satisfactionBonus: 0.0005, 
        newClientBonusRate: 0.05,
        cooperationBonusRate: 0.03
    };

    function calculate() {
        const sales = parseFloat(document.getElementById('salesAmount').value) || 0;
        const score = parseFloat(document.getElementById('satisfactionScore').value) || 0;
        const newStudents = parseInt(document.getElementById('newStudentCount').value) || 0;
        const isCoop = document.getElementById('cooperationStatus').value === 'true';

        const baseProfit = sales * PARAMS.baseRate;
        const perfBonus = sales * Math.max(0, score - 80) * PARAMS.satisfactionBonus;
        const newBonus = sales * newStudents * PARAMS.newClientBonusRate;
        const coopBonus = isCoop ? (sales * PARAMS.cooperationBonusRate) : 0;
        const total = baseProfit + perfBonus + newBonus + coopBonus;

        document.getElementById('totalProfit').textContent = `NT$ ${Math.round(total).toLocaleString()}`;
        document.getElementById('det-base').textContent = `NT$ ${Math.round(baseProfit).toLocaleString()}`;
        document.getElementById('det-perf').textContent = `NT$ ${Math.round(perfBonus).toLocaleString()}`;
        document.getElementById('det-new').textContent = `NT$ ${Math.round(newBonus).toLocaleString()}`;
        document.getElementById('det-coop').textContent = `NT$ ${Math.round(coopBonus).toLocaleString()}`;
        
        return { total, baseProfit, perfBonus, newBonus, coopBonus };
    }

    // 監聽所有輸入欄位
    ['salesAmount', 'satisfactionScore', 'newStudentCount', 'cooperationStatus'].forEach(id => {
        document.getElementById(id).addEventListener('input', calculate);
    });

    // 複製並存檔
    document.getElementById('btnSaveAndCopy').onclick = async () => {
        const name = document.getElementById('instructorName').value.trim();
        if (!name) return alert('請輸入講師姓名以利存檔');

        const results = calculate();
        const report = `【講師結算報表】\n講師：${name}\n總分潤：${document.getElementById('totalProfit').textContent}\n基礎：${document.getElementById('det-base').textContent}\n績效：${document.getElementById('det-perf').textContent}\n新客：${document.getElementById('det-new').textContent}\n合作：${document.getElementById('det-coop').textContent}`;

        try {
            await addDoc(collection(db, "profit_records"), {
                instructor: name,
                salesAmount: parseFloat(document.getElementById('salesAmount').value),
                totalProfit: results.total,
                details: results,
                createdAt: serverTimestamp()
            });

            await navigator.clipboard.writeText(report);
            alert('報表已成功上傳雲端並複製到剪貼簿！');
        } catch (e) {
            console.error(e);
            alert('雲端儲存失敗，但報表已複製。');
            await navigator.clipboard.writeText(report);
        }
    };

    window.onload = calculate;
</script>

</body>
</html>
