<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUXE POS | 專業全功能系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-black: #0a0a0a; --gold: #d4af37; --text: #f3e5ab; }
        
        .luxury-back-btn {
            position: fixed; top: 15px; left: 15px; z-index: 9999;
            display: flex; align-items: center; gap: 8px; padding: 8px 15px;
            background: rgba(10, 10, 10, 0.85); border: 1px solid var(--gold);
            border-radius: 30px; color: var(--gold); text-decoration: none;
            font-size: 13px; font-weight: bold; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }

        body { background: var(--bg-black); color: var(--text); font-family: sans-serif; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; padding: 70px 20px 20px 20px; box-sizing: border-box; }
        h1 { text-align: center; color: var(--gold); letter-spacing: 3px; font-size: 24px; margin-bottom: 20px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 5px; border: 1px solid var(--gold); background: none; color: var(--gold); cursor: pointer; font-size: 12px; border-radius: 4px; }
        .tab-btn.active { background: var(--gold); color: #000; font-weight: bold; }
        
        .identity-toggle { display: flex; background: #1a1a1a; padding: 5px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: none; color: #888; cursor: pointer; border-radius: 6px; }
        .toggle-btn.active { background: #333; color: var(--gold); font-weight: bold; }

        label { display: block; margin: 10px 0 5px; color: var(--gold); font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; outline: none; }
        .btn-main { width: 100%; padding: 15px; background: linear-gradient(45deg, #8c6d1f, #d4af37); border: none; color: #000; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        
        .result-box { margin-top: 20px; padding: 15px; border: 1px solid var(--gold); background: rgba(212, 175, 55, 0.1); border-radius: 8px; display: none; line-height: 1.6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .item-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; }
    </style>
</head>
<body>

<a href="index.html" class="luxury-back-btn"><span>🏠</span> 返回首頁</a>

<div class="container">
    <h1>👑 LUXE POS</h1>
    <div class="tabs">
        <button class="tab-btn active" data-tab="sale">收銀</button>
        <button class="tab-btn" data-tab="query">個人業績</button>
        <button class="tab-btn" data-tab="shop">店務報表</button>
    </div>

    <div id="sale" class="tab-content active">
        <div class="identity-toggle">
            <button id="btn-member" class="toggle-btn active">會員儲值扣款</button>
            <button id="btn-guest" class="toggle-btn">散客現金消費</button>
        </div>

        <div id="phone-group">
            <label>貴賓手機 (搜尋餘額)</label>
            <input type="text" id="phone" placeholder="請輸入手機號碼">
        </div>

        <label>設計師</label>
        <input type="text" id="staff" placeholder="輸入設計師姓名">
        
        <hr style="border: 0.5px solid #333; margin: 15px 0;">
        
        <label>💈 技術金額</label>
        <input type="number" id="tech_amt" value="0">
        <label>🧴 產品金額</label>
        <input type="number" id="prod_amt" value="0">
        
        <div id="payment-group">
            <label>支付方式</label>
            <select id="payment">
                <option value="儲值金">⭐ 儲值金扣款</option>
                <option value="現金">現金結帳</option>
                <option value="信用卡">信用卡刷卡</option>
            </select>
        </div>

        <button id="btnSubmitSale" class="btn-main">確認提交交易</button>
        <div id="saleResult" class="result-box"></div>
    </div>

    <div id="query" class="tab-content">
        <label>查詢設計師</label>
        <input type="text" id="q_staff" placeholder="輸入姓名">
        <button id="btnQueryStaff" class="btn-main">生成個人報表</button>
        <div id="queryResult" class="result-box"></div>
    </div>

    <div id="shop" class="tab-content">
        <div class="flex gap-2 mb-4">
            <button class="tab-btn" onclick="getShopReport('today')">今日</button>
            <button class="tab-btn" onclick="getShopReport('week')">本週</button>
            <button class="tab-btn" onclick="getShopReport('month')">本月</button>
        </div>
        <div id="shopResult" class="result-box"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc",
        authDomain: "mentor-app-b76e3.firebaseapp.com",
        projectId: "mentor-app-b76e3",
        storageBucket: "mentor-app-b76e3.firebasestorage.app",
        messagingSenderId: "757249551762",
        appId: "1:757249551762:web:512533e0a85dc1ad47654b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentIdentity = 'member';

    // 頁面切換邏輯
    document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(btn.dataset.tab).classList.add('active');
            btn.classList.add('active');
        });
    });

    // 身份切換
    document.getElementById('btn-member').onclick = () => {
        currentIdentity = 'member';
        document.getElementById('btn-member').classList.add('active');
        document.getElementById('btn-guest').classList.remove('active');
        document.getElementById('phone-group').style.display = 'block';
        document.getElementById('payment').value = '儲值金';
    };

    document.getElementById('btn-guest').onclick = () => {
        currentIdentity = 'guest';
        document.getElementById('btn-guest').classList.add('active');
        document.getElementById('btn-member').classList.remove('active');
        document.getElementById('phone-group').style.display = 'none';
        document.getElementById('payment').value = '現金';
    };

    // 提交交易
    window.processSale = async () => {
        const phone = document.getElementById('phone').value.trim();
        const staff = document.getElementById('staff').value.trim();
        const tech = Number(document.getElementById('tech_amt').value || 0);
        const prod = Number(document.getElementById('prod_amt').value || 0);
        const payment = document.getElementById('payment').value;
        const total = tech + prod;
        const resBox = document.getElementById('saleResult');

        if (!staff || total <= 0) return alert("請完整填寫金額與設計師");

        resBox.style.display = 'block';
        resBox.innerHTML = "正在處理雲端交易...";

        try {
            // 如果是會員儲值扣款，先查餘額
            if (currentIdentity === 'member' && payment === '儲值金') {
                const q = query(collection(db, "members"), where("phone", "==", phone));
                const snap = await getDocs(q);
                if (snap.empty) {
                    resBox.innerHTML = "❌ 找不到會員資料，請確認手機號碼";
                    return;
                }
                const memberDoc = snap.docs[0];
                const balance = Number(memberDoc.data().balance || 0);

                if (balance < total) {
                    resBox.innerHTML = `❌ 儲值金不足 (剩餘: $${balance})`;
                    return;
                }
                // 扣除餘額
                await updateDoc(doc(db, "members", memberDoc.id), { balance: balance - total });
            }

            // 寫入交易紀錄
            await addDoc(collection(db, "sales"), {
                staff: staff.toUpperCase(),
                tech, prod, total, payment,
                identity: currentIdentity,
                phone: currentIdentity === 'member' ? phone : "散客",
                createdAt: serverTimestamp(),
                dateStr: new Date().toISOString().split('T')[0]
            });

            resBox.innerHTML = `✅ 交易成功！<br>項目：${currentIdentity === 'member'?'會員扣款':'散客消費'}<br>總額：$${total}`;
            document.getElementById('tech_amt').value = 0;
            document.getElementById('prod_amt').value = 0;
        } catch (e) {
            resBox.innerHTML = "❌ 雲端錯誤: " + e.message;
        }
    };

    // 個人業績查詢
    window.getDesignerReport = async () => {
        const target = document.getElementById('q_staff').value.trim().toUpperCase();
        const resBox = document.getElementById('queryResult');
        if (!target) return alert("請輸入設計師姓名");

        resBox.style.display = 'block';
        resBox.innerHTML = "查詢中...";

        const q = query(collection(db, "sales"), where("staff", "==", target));
        const snap = await getDocs(q);
        
        let tTech = 0, tProd = 0;
        snap.forEach(d => {
            const data = d.data();
            tTech += (data.tech || 0);
            tProd += (data.prod || 0);
        });

        resBox.innerHTML = `<h3>👤 ${target} 累計業績</h3>技術營收：$${tTech}<br>產品營收：$${tProd}<br><hr><b>總計：$${tTech + tProd}</b>`;
    };

    // 店務報表
    window.getShopReport = async (type) => {
        const resBox = document.getElementById('shopResult');
        resBox.style.display = 'block';
        resBox.innerHTML = "正在計算全店數據...";

        const snap = await getDocs(collection(db, "sales"));
        let tTech = 0, tProd = 0, total = 0;
        let staffPerf = {};
        const now = new Date();

        snap.forEach(d => {
            const data = d.data();
            if (!data.createdAt) return;
            const saleDate = data.createdAt.toDate();
            let match = false;

            if (type === 'today') match = saleDate.toDateString() === now.toDateString();
            else if (type === 'month') match = saleDate.getMonth() === now.getMonth() && saleDate.getFullYear() === now.getFullYear();
            else if (type === 'week') {
                const diff = now.getDate() - now.getDay() + (now.getDay() === 0 ? -6 : 1);
                const monday = new Date(now.setDate(diff));
                monday.setHours(0,0,0,0);
                match = saleDate >= monday;
            }

            if (match) {
                tTech += data.tech; tProd += data.prod; total += data.total;
                staffPerf[data.staff] = (staffPerf[data.staff] || 0) + data.total;
            }
        });

        let rankHtml = Object.entries(staffPerf)
            .sort((a, b) => b[1] - a[1])
            .map(([name, amt], i) => `<div class="item-row"><span>${i+1}. ${name}</span><span>$${amt}</span></div>`)
            .join("");

        resBox.innerHTML = `<h3>📅 店務報表 (${type})</h3>全店總收：<b>$${total}</b><br>技術: $${tTech} | 產品: $${tProd}<hr>業績排行：<br>${rankHtml || "暫無數據"}`;
    };

    document.getElementById('btnSubmitSale').onclick = window.processSale;
    document.getElementById('btnQueryStaff').onclick = window.getDesignerReport;
</script>
</body>
</html>
