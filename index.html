<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活力美髮線上學堂</title>
    <style>
        :root {
            --bg: #080808;
            --gold: #D4AF37;
            --gold-light: #FCF6BA;
        }
        <script>
  (function() {
    // 1. 檢查是否已經在 App 獨立模式運行 (Standalone)
    const isAppMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    
    // 2. 檢查是否已經過授權
    const isAuthorized = localStorage.getItem('mentor_paid_access');

    // 如果是從 App 打開，且尚未驗證密碼
    if (isAppMode && !isAuthorized) {
      const password = prompt("歡迎來到學堂數位助理！本app為付費課程，請輸入您的授權密碼：");
      
      if (password === "1010") { // 您可以將 1010 改為您想要的密碼
        alert("驗證成功！正在進入學堂數位助理...");
        localStorage.setItem('mentor_paid_access', 'true');
      } else {
        alert("密碼錯誤，請聯繫客服獲取授權。");
        // 鎖定畫面，不讓進入
        document.body.innerHTML = "<div style='background:#000;color:#D4AF37;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;'><h1>🔒 本課程僅限付費學員訪問</h1><p>請重新啟動 App 並輸入正確密碼</p></div>";
      }
    } 
    // 如果學員是用「瀏覽器網頁」打開，可以顯示一個提醒
    else if (!isAppMode && !isAuthorized) {
      console.log("當前為網頁瀏覽模式，建議安裝 App 以獲得完整課程體驗。");
    }
  })();
</script>
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #080808 100%);
            color: var(--gold);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px 15px;
        }
        .top-nav { width: 100%; display: flex; justify-content: flex-end; padding: 10px 0; gap: 10px; z-index: 100; }
        .nav-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        .nav-btn:hover { background: var(--gold); color: #000; }
        header h1 { font-size: 1.8rem; letter-spacing: 5px; background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; text-align: center; font-weight: 700; }
        
        .main-container { width: 100%; max-width: 350px; }
        .btn-large { background: rgba(212, 175, 55, 0.08); border: 1px solid var(--gold); border-radius: 14px; padding: 20px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; cursor: pointer; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 22px 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; animation: breathe 4s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { border-color: rgba(212, 175, 55, 0.2); } 50% { border-color: rgba(212, 175, 55, 0.5); } }
        .icon { font-size: 26px; margin-bottom: 12px; }
        .btn-title { font-size: 0.95rem; font-weight: 500; text-align: center; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #151515; border: 1px solid var(--gold); padding: 20px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; }
        
        /* 會員中心 1.0 風格 */
        .profile-avatar-container {
            width: 100px; height: 100px; margin: 0 auto 15px;
            border: 2px solid var(--gold); border-radius: 50%;
            overflow: hidden; cursor: pointer; background: #222;
        }
        #profile-img-display { width: 100%; height: 100%; object-fit: cover; }
        .input-label { font-size: 0.75rem; color: var(--gold); margin-bottom: 4px; display: block; text-align: left; opacity: 0.8; }
        
        input[type="text"], input[type="password"], input[type="tel"] { 
            width: 100%; background: #000; border: 1px solid #333; color: #fff; 
            padding: 12px; margin-bottom: 12px; border-radius: 10px; box-sizing: border-box; 
        }
        .primary-btn { width: 100%; background: var(--gold); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        footer { font-size: 0.7rem; color: var(--gold); opacity: 0.6; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div id="guest-zone">
            <button class="nav-btn" onclick="openAuthModal()">註冊 / 登入</button>
        </div>
        <div id="user-zone" style="display:none;">
            <button class="nav-btn" onclick="openModal('profile-modal')">👤 會員中心</button>
            <button class="nav-btn" style="border-color:#555" onclick="handleLogout()">登出</button>
        </div>
    </div>

    <header><h1>學堂隨身助理</h1></header>

    <div class="main-container">
        <div class="btn-large" onclick="location.href='http://entrance.hairweb.net/'">
            <div class="icon" style="margin-right: 12px;">🌐</div>
            <span class="btn-title" style="font-size: 1.1rem; font-weight: 700;">美學入口平台</span>
        </div>

        <div class="menu-grid">
            <div class="btn" onclick="navigateToApp('pos.html')"><div class="icon">💰</div><span class="btn-title">銷售收銀</span></div>
            <div class="btn" onclick="navigateToApp('booking.html')"><div class="icon">📅</div><span class="btn-title">客戶預約</span></div>
            <div class="btn" onclick="navigateToApp('card.html')"><div class="icon">💳</div><span class="btn-title">會員卡</span></div>
            <div class="btn" onclick="navigateToApp('customer.html')"><div class="icon">🤝</div><span class="btn-title">客戶管理</span></div>
            <div class="btn" onclick="navigateToApp('store.html')"><div class="icon">📦</div><span class="btn-title">庫存管理</span></div>
            <div class="btn" onclick="navigateToApp('points.html')"><div class="icon">✨</div><span class="btn-title">升等集點</span></div>
            <div class="btn" onclick="location.href='trial2.html'"><div class="icon">📈</div><span class="btn-title">經營課程</span></div>
            <div class="btn" onclick="navigateToApp('sale.html')"><div class="icon">🚀</div><span class="btn-title">銷售開發</span></div>
            <div class="btn" onclick="navigateToApp('profit.html')"><div class="icon">🧮</div><span class="btn-title">分潤計算</span></div>
            <div class="btn" onclick="navigateToApp('student.html')"><div class="icon">🏆</div><span class="btn-title">學員關卡</span></div>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">登入啟動學堂</h3>
            <input type="text" id="email" placeholder="Email (自動記憶)">
            <input type="password" id="password" placeholder="通行密碼">
            <button id="login-btn" class="primary-btn" onclick="handleAuth()">登入並進入學堂</button>
            <button class="nav-btn" style="width:100%; margin-top:10px; border:none;" onclick="closeModal('auth-modal')">取消</button>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--gold); margin-top:0;">會員中心</h2>
            
            <span class="input-label">個人頭像 (點擊圓圈上傳)</span>
            <div class="profile-avatar-container" onclick="document.getElementById('avatar-input').click()">
                <img id="profile-img-display" src="https://via.placeholder.com/100" alt="Avatar">
                <input type="file" id="avatar-input" style="display:none;" onchange="previewImage(this)">
            </div>

            <span class="input-label">登入帳號 / Email (具記憶功能)</span>
            <input type="text" id="u-email" placeholder="請輸入 Email">

            <span class="input-label">顯示名稱 / 暱稱</span>
            <input type="text" id="u-name" placeholder="例如: polly">

            <span class="input-label">聯絡電話</span>
            <input type="tel" id="u-phone" placeholder="輸入電話號碼">

            <button class="primary-btn" onclick="saveProfileData()">雙向同步儲存</button>
            <button class="nav-btn" style="width:100%; margin-top:10px; border:none;" onclick="closeModal('profile-modal')">關閉</button>
        </div>
    </div>

    <footer>VITALITY HAIR ACADEMY © 2026</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc",
            authDomain: "mentor-app-b76e3.firebaseapp.com",
            databaseURL: "https://mentor-app-b76e3-default-rtdb.firebaseio.com",
            projectId: "mentor-app-b76e3",
            storageBucket: "mentor-app-b76e3.firebasestorage.app",
            messagingSenderId: "757249551762",
            appId: "1:757249551762:web:512533e0a85dc1ad47654b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 監控登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.isLoggedIn = true;
                document.getElementById('guest-zone').style.display = 'none';
                document.getElementById('user-zone').style.display = 'block';
                
                // 優先載入 Firebase 帳號或本地快取
                const displayEmail = user.email || localStorage.getItem('cached_email') || '';
                document.getElementById('u-email').value = displayEmail;
                localStorage.setItem('cached_email', displayEmail);
                
                loadUserData(user.uid);
            } else {
                window.isLoggedIn = false;
                document.getElementById('guest-zone').style.display = 'block';
                document.getElementById('user-zone').style.display = 'none';
            }
        });

        // 載入資料 (對應 Rules: members 節點)
        async function loadUserData(uid) {
            const memberRef = ref(db, 'members/' + uid);
            const snapshot = await get(memberRef);
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('u-name').value = data.name || '';
                document.getElementById('u-phone').value = data.phone || '';
                document.getElementById('u-email').value = data.email || auth.currentUser.email;
                if (data.avatar) document.getElementById('profile-img-display').src = data.avatar;
            }
        }

        // 雙向同步儲存 [對應 Rules: members/$member_id]
        window.saveProfileData = async () => {
            const user = auth.currentUser;
            if (!user) return alert("請先登入");
            
            const nameVal = document.getElementById('u-name').value;
            const emailVal = document.getElementById('u-email').value;
            const phoneVal = document.getElementById('u-phone').value;
            const avatarData = document.getElementById('profile-img-display').src;

            try {
                const memberRef = ref(db, 'members/' + user.uid);
                const snapshot = await get(memberRef);
                let currentData = snapshot.exists() ? snapshot.val() : {};

                // 組合新舊資料，確保不覆蓋 stamps 和 total_spent
                const updatedData = {
                    ...currentData,
                    name: nameVal,
                    email: emailVal,
                    phone: phoneVal,
                    avatar: avatarData,
                    last_updated: new Date().toISOString()
                };

                await set(memberRef, updatedData);
                localStorage.setItem('cached_email', emailVal); // 記憶 Email
                
                alert("會員資料已同步至雲端伺服器！");
                closeModal('profile-modal');
            } catch (err) {
                alert("儲存失敗：您可能沒有權限或格式錯誤");
                console.error(err);
            }
        };

        window.handleAuth = async function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeModal('auth-modal');
                alert("學堂啟動成功！");
            } catch (e) {
                alert("驗證失敗：帳號密碼不正確");
            }
        };

        window.handleLogout = () => { if(confirm("確定登出？")) signOut(auth); };

        window.navigateToApp = function(url) {
            if (!window.isLoggedIn) {
                alert("請先完成登入哦！");
                openAuthModal();
                return;
            }
            location.href = url;
        };

        window.previewImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('profile-img-display').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        };
    </script>

    <script>
        function openAuthModal() {
            document.getElementById('email').value = localStorage.getItem('cached_email') || '';
            document.getElementById('auth-modal').style.display = 'flex';
        }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
