<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活力美髮線上學堂 2.0</title>
    <style>
        :root {
            --bg: #080808;
            --gold: #D4AF37;
            --gold-bright: #FFD700;
            --glass: rgba(255, 255, 255, 0.05);
            --c-1: #f6d365; --c-2: #00f2fe; --c-3: #ff9a9e; --c-4: #fa709a;
            --c-5: #a18cd1; --c-6: #43e97b; --c-7: #f093fb; --c-8: #4facfe;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #080808 100%);
            color: #fff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }

        /* 奢華金屬漆質感標題 */
        header h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
        }

        /* 磨砂玻璃容器 */
        .glass-card {
            width: 100%;
            max-width: 350px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* 輸入框與金色光暈 */
        textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* 儲存按鈕樣式與點擊縮放 */
        .save-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #B38728, #BF953F);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s active, all 0.4s ease;
        }

        .save-btn:active { transform: scale(0.95); }

        /* 智慧感應：金光呼吸效果 */
        @keyframes goldBreathe {
            0% { box-shadow: 0 0 5px var(--gold); }
            50% { box-shadow: 0 0 25px var(--gold-bright); }
            100% { box-shadow: 0 0 5px var(--gold); }
        }

        .has-content {
            animation: goldBreathe 1.5s infinite ease-in-out;
            background: linear-gradient(135deg, #FCF6BA, #BF953F) !important;
        }

        /* 網格系統 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 22px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ddd;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .icon { font-size: 26px; margin-bottom: 12px; }
        .btn-title { font-size: 0.9rem; font-weight: 500; text-align: center; }

        footer { margin-top: auto; font-size: 0.65rem; color: #666; letter-spacing: 2px; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>學堂隨身助理</h1>
    </header>

    <div class="glass-card">
        <a href="http://entrance.hairweb.net/" style="text-decoration:none; display:block; margin-bottom:15px; text-align:center; color:var(--gold); border:1px solid var(--gold); padding:10px; border-radius:8px;">
            🌐 美學入口平台 (分享專用)
        </a>
        
        <textarea id="noteArea" rows="3" placeholder="在這邊輸入給客戶的備註..."></textarea>
        
        <button id="saveBtn" class="save-btn" onclick="permanentSave()">永久儲存至手機</button>
        <div id="status" style="font-size: 0.7rem; color: var(--gold); margin-top: 8px; text-align: center; opacity: 0.7;">即時存檔中...</div>
    </div>

    <div class="menu-grid">
        <a href="https://pos.hairweb.net/" class="btn"><div class="icon">💰</div><span class="btn-title">銷售收銀</span></a>
        <a href="https://Booking.hairweb.net" class="btn"><div class="icon">📅</div><span class="btn-title">客戶預約</span></a>
        <a href="https://card.hairweb.net/" class="btn"><div class="icon">💳</div><span class="btn-title">會員卡</span></a>
        <a href="https://customer.hairweb.net/" class="btn"><div class="icon">🤝</div><span class="btn-title">客戶管理</span></a>
        <a href="http://store.hairweb.net/" class="btn"><div class="icon">📦</div><span class="btn-title">庫存管理</span></a>
        <a href="http://points.hairweb.net/" class="btn"><div class="icon">✨</div><span class="btn-title">升等集點</span></a>
        <a href="https://www.course1.hairweb.net/首頁" class="btn"><div class="icon">📈</div><span class="btn-title">經營課程</span></a>
        <a href="https://student.hairweb.net/" class="btn"><div class="icon">🏆</div><span class="btn-title">學員關卡</span></a>
    </div>

    <footer>VITALITY HAIR ACADEMY © 2026</footer>

    <script>
        const noteArea = document.getElementById('noteArea');
        const saveBtn = document.getElementById('saveBtn');
        const statusText = document.getElementById('status');

        // 1. 即時暫存 (Auto-Save): 打一個字存一個字
        noteArea.oninput = () => {
            const content = noteArea.value;
            // 存入臨時空間
            localStorage.setItem('temp_note', content);
            
            // 2. 智慧感應按鈕：有文字就觸發「金光呼吸」
            if (content.trim().length > 0) {
                saveBtn.classList.add('has-content');
                statusText.innerText = "偵測到新內容，建議儲存...";
            } else {
                saveBtn.classList.remove('has-content');
                statusText.innerText = "等待輸入...";
            }
        };

        // 3. 永久儲存：點擊按鈕後存檔
        function permanentSave() {
            const content = noteArea.value;
            localStorage.setItem('permanent_note', content);
            
            saveBtn.classList.remove('has-content');
            statusText.innerText = "✅ 已成功存檔至本地空間";
            
            // 兩秒後恢復
            setTimeout(() => {
                statusText.innerText = "資料安全儲存中";
            }, 2000);
        }

        // 4. 初始化讀取：開網頁時自動抓取之前存過的內容
        window.onload = () => {
            const savedData = localStorage.getItem('permanent_note') || localStorage.getItem('temp_note');
            if (savedData) {
                noteArea.value = savedData;
                if(savedData.trim().length > 0) saveBtn.classList.add('has-content');
            }
        };
    </script>

        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
            authDomain: "holyhairsalon-f73bf.firebaseapp.com",
            projectId: "holyhairsalon-f73bf",
            appId: "1:960169055224:web:59f89c0dcf194531bf3c0d",
            measurementId: "G-JCQZ78GEV2"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
    </script>
</body>
</html>
