<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>活力美髮線上學堂</title>
    <style>
        :root {
            --bg: #080808;
            --gold: #D4AF37;
            --gold-light: #FCF6BA;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            margin: 0;
        }

        body {
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #080808 100%);
            color: var(--gold);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            transform: scale(0.9); /* 您要求的縮小面板 */
            transform-origin: center center;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-weight: 700;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .share-section {
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
        }

        /* 靜態高級感按鈕 (無呼吸燈) */
        .btn-large, .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 18px;
            text-decoration: none;
            color: var(--gold);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s ease; /* 縮短時間，反應更快 */
        }

        .btn-large {
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 核心觸感：點擊時的反饋 --- */
        .btn-large:active, .btn:active {
            transform: scale(0.94); /* 點擊縮小感 */
            background: rgba(212, 175, 55, 0.2); /* 點擊變亮 */
            border-color: var(--gold); /* 邊框瞬間變金 */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon { font-size: 26px; margin-bottom: 8px; }
        .btn-title { font-size: 0.9rem; font-weight: 500; text-align: center; color: var(--gold); }

        footer { 
            margin-top: 20px; 
            font-size: 0.6rem; 
            color: var(--gold); 
            opacity: 0.5; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header>
        <h1>學堂隨身助理</h1>
    </header>

    <div class="share-section">
        <a href="http://entrance.hairweb.net/" class="btn-large">
            <div class="icon" style="margin-bottom: 0; margin-right: 12px;">🌐</div>
            <span class="btn-title" style="font-size: 1rem; font-weight: 700;">美學入口平台</span>
        </a>
    </div>

    <div class="menu-grid">
        <a href="https://pos.hairweb.net/" class="btn"><div class="icon">💰</div><span class="btn-title">銷售收銀</span></a>
        <a href="https://Booking.hairweb.net" class="btn"><div class="icon">📅</div><span class="btn-title">客戶預約</span></a>
        <a href="https://card.hairweb.net/" class="btn"><div class="icon">💳</div><span class="btn-title">會員卡</span></a>
        <a href="https://customer.hairweb.net/" class="btn"><div class="icon">🤝</div><span class="btn-title">客戶管理</span></a>
        <a href="http://store.hairweb.net/" class="btn"><div class="icon">📦</div><span class="btn-title">庫存管理</span></a>
        <a href="http://points.hairweb.net/" class="btn"><div class="icon">✨</div><span class="btn-title">升等集點</span></a>
        <a href="https://www.course1.hairweb.net/首頁" class="btn"><div class="icon">📈</div><span class="btn-title">經營課程</span></a>
        <a href="http://sale.hairweb.net/" class="btn"><div class="icon">🚀</div><span class="btn-title">銷售開發</span></a>
        <a href="http://profit.hairweb.net/" class="btn"><div class="icon">🧮</div><span class="btn-title">分潤計算</span></a>
        <a href="https://student.hairweb.net/" class="btn"><div class="icon">🏆</div><span class="btn-title">學員關卡</span></a>
    </div>

    <footer>VITALITY HAIR ACADEMY © 2026</footer>

</body>
</html>
