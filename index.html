<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活力美髮線上學堂</title>
    <style>
        :root {
            --bg: #080808;
            --gold: #D4AF37;
            --gold-light: #FCF6BA;
            /* 網格色彩配置維持原樣，但僅用於懸停邊框 */
            --c-1: #f6d365; --c-2: #00f2fe; --c-3: #ff9a9e; --c-4: #fa709a;
            --c-5: #a18cd1; --c-6: #43e97b; --c-7: #f093fb; --c-8: #4facfe;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #080808 100%);
            color: var(--gold); /* 全域文字改為金色 */
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }

        /* 奢華金屬漆質感標題 */
        header h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* 獨立出來的入口平台 - 採用金邊與金字 */
        .share-section {
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }

        .btn-large {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--gold); /* 確保是金色 */
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-large:hover {
            background: var(--gold);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 22px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--gold); /* 標題文字改為金色 */
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { border-color: rgba(212, 175, 55, 0.2); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
            50% { border-color: rgba(212, 175, 55, 0.5); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        }

        .icon { font-size: 26px; margin-bottom: 12px; }
        .btn-title { font-size: 0.95rem; font-weight: 500; letter-spacing: 1px; text-align: center; color: var(--gold); }

        .btn:hover {
            transform: translateY(-4px);
            background: rgba(212, 175, 55, 0.15);
            animation: none;
            color: var(--gold-light);
        }

        /* 懸停邊框色彩噴發效果 */
        .btn:nth-child(1):hover { border-color: var(--c-1); box-shadow: 0 0 20px var(--c-1); }
        .btn:nth-child(2):hover { border-color: var(--c-2); box-shadow: 0 0 20px var(--c-2); }
        .btn:nth-child(3):hover { border-color: var(--c-3); box-shadow: 0 0 20px var(--c-3); }
        .btn:nth-child(4):hover { border-color: var(--c-4); box-shadow: 0 0 20px var(--c-4); }
        .btn:nth-child(5):hover { border-color: var(--c-5); box-shadow: 0 0 20px var(--c-5); }
        .btn:nth-child(6):hover { border-color: var(--c-6); box-shadow: 0 0 20px var(--c-6); }
        .btn:nth-child(7):hover { border-color: var(--c-7); box-shadow: 0 0 20px var(--c-7); }
        .btn:nth-child(8):hover { border-color: var(--c-8); box-shadow: 0 0 20px var(--c-8); }
        .btn:nth-child(9):hover { border-color: var(--c-1); box-shadow: 0 0 20px var(--c-1); }
        .btn:nth-child(10):hover { border-color: var(--c-2); box-shadow: 0 0 20px var(--c-2); }

        footer { margin-top: auto; font-size: 0.7rem; color: var(--gold); opacity: 0.6; letter-spacing: 2px; padding: 20px; text-align: center; }
    </style>
</head>
