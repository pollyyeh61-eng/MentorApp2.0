<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活力美髮線上學堂</title>
    <style>
        :root {
            --bg: #080808;
            --gold: #D4AF37;
            --gold-light: #FCF6BA;
            --glass: rgba(255, 255, 255, 0.05);
            --c-1: #f6d365; --c-2: #00f2fe; --c-3: #ff9a9e; --c-4: #fa709a;
            --c-5: #a18cd1; --c-6: #43e97b; --c-7: #f093fb; --c-8: #4facfe;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #080808 100%);
            color: var(--gold);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px 15px;
            overflow-x: hidden;
        }

        /* 右上角登入控制區 */
        .auth-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 10px;
            gap: 10px;
            z-index: 100;
        }

        .auth-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .auth-btn:hover { background: var(--gold); color: #000; }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 25px 0;
            font-weight: 700;
        }

        /* 內容區塊控制 */
        .main-content { width: 100%; max-width: 350px; }
        
        .share-section { margin-bottom: 20px; }

        .btn-large, .btn {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-decoration: none;
            color: var(--gold);
            display: flex;
            transition: all 0.4s ease;
        }

        .btn-large {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .btn {
            background: var(--glass);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 22px 10px;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .btn.locked { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        .icon { font-size: 26px; margin-bottom: 12px; }
        .btn-title { font-size: 0.95rem; font-weight: 500; text-align: center; }

        /* 彈窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid var(--gold);
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            position: relative;
        }

        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; }

        input, textarea {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .primary-btn {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 會員中心照片相關 */
        .profile-pic-container {
            width: 100px; height: 100px;
            border: 2px dashed var(--gold);
            margin: 10px auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }

        footer { font-size: 0.7rem; opacity: 0.6; letter-spacing: 2px; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-bar" id="auth-bar">
        <button class="auth-btn" onclick="openModal('login-modal')">登入</button>
        <button class="auth-btn" onclick="openModal('login-modal')">註冊</button>
    </div>

    <header>
        <h1>學堂隨身助理</h1>
    </header>

    <div class="main-content">
        <div class="share-section">
            <a href="http://entrance.hairweb.net/" class="btn-large app-link">
                <div class="icon" style="margin-bottom: 0; margin-right: 12px;">🌐</div>
                <span class="btn-title" style="font-size: 1.1rem; font-weight: 700;">美學入口平台</span>
            </a>
        </div>

        <div class="menu-grid">
            <a href="https://pos.hairweb.net/" class="btn app-link"><div class="icon">💰</div><span class="btn-title">銷售收銀</span></a>
            <a href="http://booking.hairweb.net" class="btn app-link"><div class="icon">📅</div><span class="btn-title">客戶預約</span></a>
            <a href="https://card.hairweb.net/" class="btn app-link"><div class="icon">💳</div><span class="btn-title">會員卡</span></a>
            <a href="https://customer.hairweb.net/" class="btn app-link"><div class="icon">🤝</div><span class="btn-title">客戶管理</span></a>
            <a href="http://store.hairweb.net/" class="btn app-link"><div class="icon">📦</div><span class="btn-title">庫存管理</span></a>
            <a href="http://points.hairweb.net/" class="btn app-link"><div class="icon">✨</div><span class="btn-title">升等集點</span></a>
            <a href="http://trial2.hairweb.net/" class="btn app-link"><div class="icon">📈</div><span class="btn-title">經營課程</span></a>
            <a href="http://sale.hairweb.net/" class="btn app-link"><div class="icon">🚀</div><span class="btn-title">銷售開發</span></a>
            <a href="http://profit.hairweb.net/" class="btn app-link"><div class="icon">🧮</div><span class="btn-title">分潤計算</span></a>
            <a href="https://student.hairweb.net/" class="btn app-link"><div class="icon">🏆</div><span class="btn-title">學員關卡</span></a>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('login-modal')">&times;</span>
            <h2 style="text-align:center">歡迎回來</h2>
            <input type="text" placeholder="帳號 / Email">
            <input type="password" placeholder="密碼">
            <button class="primary-btn" onclick="handleLogin()">立即登入</button>
            <p style="text-align:center; font-size:0.8rem; color: #888; cursor:pointer" onclick="alert('重設密碼連結已發送至您的信箱')">忘記密碼？</p>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modal-content" style="max-width: 350px;">
            <span class="close-btn" onclick="closeModal('profile-modal')">&times;</span>
            <h3 style="text-align:center">個人會員資訊</h3>
            
            <div class="profile-pic-container" id="profile-pic-box">
                <span id="pic-placeholder">📷</span>
                <img id="preview-img" alt="Profile">
            </div>
            
            <input type="file" id="file-input" style="display:none" accept="image/*" onchange="previewFile()">
            <div style="display:flex; gap:5px; margin-bottom:10px">
                <button class="primary-btn" style="font-size:0.7rem; padding:5px" onclick="document.getElementById('file-input').click()">增加照片</button>
                <button class="primary-btn" style="font-size:0.7rem; padding:5px; background:#444; color:#fff" onclick="deletePhoto()">刪除照片</button>
            </div>

            <input type="text" id="user-name" placeholder="姓名" oninput="autoSave()">
            <input type="tel" id="user-phone" placeholder="電話" oninput="autoSave()">
            <textarea id="user-bio" placeholder="自我介紹" rows="3" oninput="autoSave()"></textarea>
            
            <button class="primary-btn" onclick="saveToCloud()">修正並永久儲存</button>
        </div>
    </div>

    <footer>VITALITY HAIR ACADEMY © 2026</footer>

    <script>
        // 模擬登入狀態
        let isLoggedIn = false;

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 登入處理
        function handleLogin() {
            isLoggedIn = true;
            closeModal('login-modal');
            updateUI();
            alert("登入成功！");
        }

        // 更新 UI 狀態
        function updateUI() {
            const authBar = document.getElementById('auth-bar');
            if (isLoggedIn) {
                authBar.innerHTML = `<button class="auth-btn" onclick="openModal('profile-modal')">👤 會員中心</button>
                                     <button class="auth-btn" style="border-color:#555" onclick="location.reload()">登出</button>`;
                loadSavedData();
            }
        }

        // 攔截按鍵
        document.querySelectorAll('.app-link').forEach(link => {
            link.addEventListener('click', function(e) {
                if (!isLoggedIn) {
                    e.preventDefault();
                    alert("請先登入後才能使用功能哦！");
                    openModal('login-modal');
                }
            });
        });

        // 即時暫存 Auto-Save
        function autoSave() {
            const userData = {
                name: document.getElementById('user-name').value,
                phone: document.getElementById('user-phone').value,
                bio: document.getElementById('user-bio').value,
                photo: document.getElementById('preview-img').src
            };
            localStorage.setItem('temp_user_data', JSON.stringify(userData));
            console.log("資料已自動暫存...");
        }

        // 讀取存檔
        function loadSavedData() {
            const saved = localStorage.getItem('temp_user_data');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('user-name').value = data.name || '';
                document.getElementById('user-phone').value = data.phone || '';
                document.getElementById('user-bio').value = data.bio || '';
                if (data.photo && data.photo.startsWith('data:image')) {
                    const img = document.getElementById('preview-img');
                    img.src = data.photo;
                    img.style.display = 'block';
                    document.getElementById('pic-placeholder').style.display = 'none';
                }
            }
        }

        // 照片處理
        function previewFile() {
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                const img = document.getElementById('preview-img');
                img.src = reader.result;
                img.style.display = 'block';
                document.getElementById('pic-placeholder').style.display = 'none';
                autoSave();
            }
            if (file) reader.readAsDataURL(file);
        }

        function deletePhoto() {
            const img = document.getElementById('preview-img');
            img.src = "";
            img.style.display = 'none';
            document.getElementById('pic-placeholder').style.display = 'block';
            autoSave();
        }

        // 永久儲存 (模擬雲端)
        function saveToCloud() {
            autoSave();
            const data = localStorage.getItem('temp_user_data');
            // 此處可接 Firebase 儲存代碼
            alert("資料已成功修正並同步至雲端儲存空間！");
            closeModal('profile-modal');
        }
    </script>
</body>
</html>
