<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活力美髮線上學堂</title>
    <style>
        :root {
            --bg: #080808;
            --gold: #D4AF37;
            --gold-light: #FCF6BA;
            --c-1: #f6d365; --c-2: #00f2fe; --c-3: #ff9a9e; --c-4: #fa709a;
            --c-5: #a18cd1; --c-6: #43e97b; --c-7: #f093fb; --c-8: #4facfe;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #1a1a1a 0%, #080808 100%);
            color: var(--gold);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px 15px;
            overflow-x: hidden;
        }

        .auth-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 10px;
            gap: 10px;
            z-index: 100;
        }

        .auth-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .auth-btn:hover { background: var(--gold); color: #000; }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 25px 0;
            font-weight: 700;
        }

        .main-content { width: 100%; max-width: 350px; }

        /* 大按鈕：入口平台 */
        .btn-large {
            cursor: pointer;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--gold);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--gold);
            transition: 0.4s;
        }
        .btn-large:hover { transform: translateY(-3px); box-shadow: 0 0 15px var(--gold); }

        /* 功能網格 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .btn {
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 22px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: breathe 4s infinite ease-in-out;
            transition: 0.4s;
        }

        @keyframes breathe {
            0%, 100% { border-color: rgba(212, 175, 55, 0.2); }
            50% { border-color: rgba(212, 175, 55, 0.6); box-shadow: 0 0 10px rgba(212,175,55,0.1); }
        }

        .btn:hover { transform: translateY(-5px); animation: none; background: rgba(212,175,55,0.1); }
        
        /* 每個按鈕不同的 Hover 光暈 */
        .btn:nth-child(1):hover { border-color: var(--c-1); box-shadow: 0 0 15px var(--c-1); }
        .btn:nth-child(2):hover { border-color: var(--c-2); box-shadow: 0 0 15px var(--c-2); }
        .btn:nth-child(3):hover { border-color: var(--c-3); box-shadow: 0 0 15px var(--c-3); }
        /* ...以此類推 */

        .icon { font-size: 26px; margin-bottom: 12px; }
        .btn-title { font-size: 0.95rem; font-weight: 500; text-align: center; }

        /* 彈窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid var(--gold);
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
        }

        .terms-scroll {
            height: 100px; overflow-y: scroll; background: #000;
            padding: 10px; font-size: 0.7rem; color: #888; margin-bottom: 10px; border: 1px solid #333;
        }

        input, textarea {
            width: 100%; background: #000; border: 1px solid #444; color: #fff;
            padding: 10px; margin: 8px 0; border-radius: 8px; box-sizing: border-box;
        }

        .primary-btn {
            width: 100%; background: var(--gold); color: #000; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .primary-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        footer { font-size: 0.7rem; opacity: 0.6; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-bar" id="auth-bar">
        <button class="auth-btn" onclick="openAuthModal()">登入 / 註冊</button>
    </div>

    <header>
        <h1>學堂隨身助理</h1>
    </header>

    <div class="main-content">
        <div class="btn-large" onclick="navigateToApp('http://entrance.hairweb.net/')">
            <div class="icon" style="margin-bottom: 0; margin-right: 12px;">🌐</div>
            <span class="btn-title" style="font-size: 1.1rem; font-weight: 700;">美學入口平台</span>
        </div>

        <div class="menu-grid">
            <div class="btn" onclick="navigateToApp('https://pos.hairweb.net/')"><div class="icon">💰</div><span class="btn-title">銷售收銀</span></div>
            <div class="btn" onclick="navigateToApp('http://booking.hairweb.net')"><div class="icon">📅</div><span class="btn-title">客戶預約</span></div>
            <div class="btn" onclick="navigateToApp('https://card.hairweb.net/')"><div class="icon">💳</div><span class="btn-title">會員卡</span></div>
            <div class="btn" onclick="navigateToApp('https://customer.hairweb.net/')"><div class="icon">🤝</div><span class="btn-title">客戶管理</span></div>
            <div class="btn" onclick="navigateToApp('http://store.hairweb.net/')"><div class="icon">📦</div><span class="btn-title">庫存管理</span></div>
            <div class="btn" onclick="navigateToApp('http://points.hairweb.net/')"><div class="icon">✨</div><span class="btn-title">升等集點</span></div>
            <div class="btn" onclick="navigateToApp('http://trial2.hairweb.net/')"><div class="icon">📈</div><span class="btn-title">經營課程</span></div>
            <div class="btn" onclick="navigateToApp('http://sale.hairweb.net/')"><div class="icon">🚀</div><span class="btn-title">銷售開發</span></div>
            <div class="btn" onclick="navigateToApp('http://profit.hairweb.net/')"><div class="icon">🧮</div><span class="btn-title">分潤計算</span></div>
            <div class="btn" onclick="navigateToApp('https://student.hairweb.net/')"><div class="icon">🏆</div><span class="btn-title">學員關卡</span></div>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center; margin-top:0;">學員登入</h2>
            <input type="text" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="密碼">
            
            <div id="terms-box">
                <div class="terms-scroll">
                    <h4>服務條款</h4>
                    1. 本系統僅供學員教學使用。<br>
                    2. 個資受加密保護，嚴禁轉借帳號。<br>
                    3. 同意接受平台通知。
                </div>
                <div style="font-size:0.8rem; margin-bottom:10px;">
                    <input type="checkbox" id="agree-check" style="width:auto;" onchange="document.getElementById('login-sub-btn').disabled = !this.checked">
                    <label for="agree-check">我已閱讀並同意以上條款</label>
                </div>
            </div>

            <button id="login-sub-btn" class="primary-btn" disabled onclick="handleFirebaseLogin()">立即登入</button>
            <button class="auth-btn" style="width:100%; border:none; margin-top:10px;" onclick="closeModal('login-modal')">取消</button>
        </div>
    </div>

    <footer>VITALITY HAIR ACADEMY © 2026</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc",
            authDomain: "mentor-app-b76e3.firebaseapp.com",
            projectId: "mentor-app-b76e3",
            appId: "1:757249551762:web:512533e0a85dc1ad47654b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.isLoggedIn = false;

        // 監聽登入
        onAuthStateChanged(auth, (user) => {
            const authBar = document.getElementById('auth-bar');
            if (user) {
                window.isLoggedIn = true;
                authBar.innerHTML = `<button class="auth-btn" onclick="alert('開啟會員中心')">👤 會員中心</button>
                                     <button class="auth-btn" style="border-color:#555" onclick="window.doLogout()">登出</button>`;
            } else {
                window.isLoggedIn = false;
                authBar.innerHTML = `<button class="auth-btn" onclick="openAuthModal()">登入 / 註冊</button>`;
            }
        });

        // 登入函數
        window.handleFirebaseLogin = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
                localStorage.setItem('terms_accepted', 'true');
                closeModal('login-modal');
                alert("歡迎回來！");
            } catch (err) { alert("登入失敗，請檢查帳密"); }
        };

        window.doLogout = () => signOut(auth);

        // SSO 跳轉邏輯
        window.navigateToApp = async (url) => {
            if (!window.isLoggedIn) {
                alert("請先登入後才能使用功能哦！");
                openAuthModal();
                return;
            }
            const user = auth.currentUser;
            const token = await user.getIdToken();
            window.location.href = `${url}?token=${token}`;
        };
    </script>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openAuthModal() {
            const accepted = localStorage.getItem('terms_accepted') === 'true';
            document.getElementById('terms-box').style.display = accepted ? 'none' : 'block';
            document.getElementById('login-sub-btn').disabled = !accepted;
            openModal('login-modal');
        }
    </script>
</body>
</html>
