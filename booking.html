<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOGUE 美業系統 - 完整功能版</title>
    <style>
        :root {
            --dark-bg: #000000;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --gold-bright: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --status-wait: #ff4d4d;
            --status-done: #00ff00;
            --status-auto: #00d4ff;
            /* 黃金比例字體 */
            --font-main: 18px;
            --font-large: 20px;
        }

        body {
            background-color: var(--dark-bg); color: #fff;
            font-family: 'PingFang TC', sans-serif; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 120px;
            font-size: var(--font-main);
        }

        /* 頂部月份標題樣式 (對齊截圖) */
        .header-date { color: var(--gold-bright); font-size: var(--font-large); margin: 20px 0; font-weight: bold; }

        .panel { display: none; width: 92%; max-width: 420px; padding-top: 20px; }
        .panel.active { display: block; }

        .glass-card { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        
        /* 服務項目網格 (恢復完整10項) */
        .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .service-item { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px 5px; font-size: 15px; text-align: center; cursor: pointer; color: #888; }
        .service-item.selected { border-color: var(--gold-bright); color: var(--gold-bright); background: var(--gold-dim); }

        select, input { width: 100%; padding: 15px; margin-bottom: 12px; background: #080808; border: 1.5px solid #222; border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        
        .btn-action { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: var(--font-main); font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-gold { background: var(--gold-bright); color: #000; }
        
        /* 抽屜式歸檔 (依姓名) */
        .archive-drawer { margin-top: 20px; width: 100%; }
        .drawer-box { background: #111; border-radius: 15px; margin-bottom: 10px; overflow: hidden; border: 1px solid #222; }
        .drawer-btn { width: 100%; padding: 15px; background: #1a1a1a; border: none; color: var(--gold-bright); display: flex; justify-content: space-between; font-size: 16px; cursor: pointer; }
        .drawer-content { display: none; padding: 15px; background: #000; border-top: 1px solid #222; }

        .history-item { background: rgba(255,255,255,0.04); padding: 15px; border-radius: 18px; margin-bottom: 12px; border-left: 4px solid var(--gold-bright); position: relative; }
        
        .tab-switcher { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; background: #111; border-radius: 50px; padding: 5px; width: 260px; border: 1px solid #333; z-index: 1000; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #666; font-size: 14px; cursor: pointer; }
        .tab-btn.active { background: var(--gold-bright); color: #000; border-radius: 40px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="client" class="panel active">
        <h2 class="header-date">VOGUE 顧客預約</h2>
        <div class="glass-card">
            <input type="text" id="custName" placeholder="顧客姓名">
            <input type="tel" id="custPhone" placeholder="聯繫電話">
            <div class="service-grid">
                <div class="service-item" onclick="this.classList.toggle('selected')">洗髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">剪髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">洗加剪</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">單色染髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">雙色染髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">漂髮設計</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">熱塑燙髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">冷塑燙髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">頭皮護理</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">髮質護理</div>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="date" id="appDate" style="flex:1">
                <input type="time" id="appTime" style="flex:1">
            </div>
            <button class="btn-action btn-gold" onclick="addBooking()">送出預約單</button>
        </div>
    </div>

    <div id="designer" class="panel">
        <h2 class="header-date">2026年 1月</h2>
        <h3 style="color:var(--status-wait); margin-left:10px; font-size:18px;">⚠️ 待處理單 (請接單/追蹤)</h3>
        <div id="designer-list"></div>

        <h3 style="color:var(--gold-bright); margin-left:10px; margin-top:30px; font-size:18px;">📁 歷史歸檔 (依客戶歸類)</h3>
        <div id="archive-section" class="archive-drawer"></div>
    </div>

    <div class="tab-switcher">
        <button class="tab-btn active" id="btn-client" onclick="switchTab('client')">客戶入口</button>
        <button class="tab-btn" id="btn-designer" onclick="switchTab('designer')">設計師後台</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
            authDomain: "holyhairsalon-f73bf.firebaseapp.com",
            databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
            projectId: "holyhairsalon-f73bf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bookingRef = ref(db, 'vogue_bookings');

        let allData = {};

        window.switchTab = (t) => {
            if(t === 'designer' && prompt("管理碼") !== '0000') return;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        };

        window.addBooking = () => {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const date = document.getElementById('appDate').value;
            const time = document.getElementById('appTime').value;
            const services = Array.from(document.querySelectorAll('.service-item.selected')).map(el => el.innerText);
            if(!name || !phone || !date) return alert("資訊未填全");

            push(bookingRef, { name, phone, date, time, services, status: "待接單", ts: Date.now() });
            alert("預約成功！");
            document.querySelectorAll('.service-item').forEach(el => el.classList.remove('selected'));
        };

        window.processOrder = (key, status) => {
            if(status === '已完成') {
                const order = allData[key];
                const d = new Date(order.date);
                d.setDate(d.getDate() + 60);
                push(bookingRef, {
                    name: order.name, phone: order.phone, services: ["(回訪追蹤)"],
                    date: d.toISOString().split('T')[0], time: order.time,
                    status: "系統提醒", ts: Date.now()
                });
                alert("已結案並排程60天後提醒！");
            }
            update(ref(db, `vogue_bookings/${key}`), { status: status });
        };

        onValue(bookingRef, (snap) => {
            allData = snap.val() || {};
            renderDesigner();
        });

        function renderDesigner() {
            const list = document.getElementById('designer-list');
            const archive = document.getElementById('archive-section');
            list.innerHTML = ""; archive.innerHTML = "";
            const groups = {};

            Object.keys(allData).reverse().forEach(key => {
                const b = allData[key];
                
                // 待處理顯示
                if(b.status !== '已完成') {
                    const isAuto = b.status === '系統提醒';
                    list.innerHTML += `
                        <div class="history-item" style="border-left-color:${isAuto?'#00d4ff':'#ff4d4d'}">
                            <b>${b.name}</b> (${b.phone}) <span style="font-size:12px; color:#aaa;">${b.status}</span><br>
                            <small>${b.date} ${b.time} / 項目：${b.services?.join(',') || '未選'}</small><br>
                            ${b.status==='待接單'?`<button class="btn-action btn-gold" onclick="processOrder('${key}','已接單')">確認接單</button>`:''}
                            ${b.status==='已接單'?`<button class="btn-action btn-gold" style="background:#00ff00" onclick="processOrder('${key}','已完成')">完成服務(啟動追蹤)</button>`:''}
                        </div>`;
                } else {
                    // 已完成進行歸檔
                    if(!groups[b.name]) groups[b.name] = [];
                    groups[b.name].push(b);
                }
            });

            // 渲染抽屜歸檔
            for(let name in groups) {
                const itemsHtml = groups[name].map(h => `<div style="padding:5px 0; border-bottom:1px solid #222;">📅 ${h.date} - ${h.services?.join(',')}</div>`).join('');
                archive.innerHTML += `
                    <div class="drawer-box">
                        <button class="drawer-btn" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                            <span>👤 ${name}</span> <span>${groups[name].length}次 ▾</span>
                        </button>
                        <div class="drawer-content">${itemsHtml}</div>
                    </div>`;
            }
        }
    </script>
</body>
</html>
