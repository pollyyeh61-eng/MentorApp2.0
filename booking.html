<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOGUE 獲利機器 - 終極整合版</title>
    <style>
        :root {
            --dark-bg: #000; 
            --gold: #d4af37; 
            --gold-dim: rgba(212, 175, 55, 0.1);
            --font-main: 18px; /* 黃金比例字體 */
            --font-large: 20px;
            --status-wait: #ff4d4d;
            --status-ready: #00ff00;
            --status-auto: #00d4ff;
        }
        body {
            background: var(--dark-bg); color: #fff; font-family: 'PingFang TC', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px;
            font-size: var(--font-main);
        }
        .panel { display: none; width: 92%; max-width: 420px; padding-top: 20px; }
        .panel.active { display: block; }

        /* 頂部範本滾動 */
        .sample-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 10px 0; margin-bottom: 20px; }
        .sample-img { width: 110px; height: 150px; object-fit: cover; border-radius: 12px; border: 1px solid #333; flex-shrink: 0; }

        .glass-card { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        
        /* 服務網格 */
        .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .service-item { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px 5px; font-size: 16px; text-align: center; cursor: pointer; color: #888; }
        .service-item.selected { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #080808; border: 1.5px solid #222; border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        label { display: block; margin-bottom: 5px; color: var(--gold); font-size: 14px; margin-left: 5px; }

        /* 上傳區域 */
        .upload-box { border: 2px dashed #444; border-radius: 15px; padding: 15px; text-align: center; color: #888; margin-bottom: 15px; font-size: 15px; }
        #preview-img { width: 100%; border-radius: 10px; display: none; margin-top: 10px; }

        .btn-action { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: var(--font-main); font-weight: bold; cursor: pointer; background: var(--gold); color: #000; }
        
        /* 狀態與進度 */
        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: bold; }
        .tag-wait { background: var(--status-wait); color: #fff; }
        .tag-ready { background: var(--status-ready); color: #000; }
        .tag-auto { background: var(--status-auto); color: #000; }

        .history-item { background: rgba(255,255,255,0.04); padding: 15px; border-radius: 18px; margin-bottom: 12px; border-left: 5px solid var(--gold); }
        .booking-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-top: 8px; border: 1px solid #444; }

        /* 抽屜樣式 */
        .drawer-box { background: #111; border-radius: 15px; margin-bottom: 10px; overflow: hidden; border: 1px solid #222; }
        .drawer-btn { width: 100%; padding: 15px; background: #1a1a1a; border: none; color: var(--gold); display: flex; justify-content: space-between; font-size: 18px; cursor: pointer; }
        .drawer-content { display: none; padding: 15px; background: #000; }

        .tab-switcher { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; background: #111; border-radius: 50px; padding: 5px; border: 1px solid #333; z-index: 1000; }
        .tab-btn { padding: 12px 25px; border: none; background: transparent; color: #666; font-size: 14px; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: #000; border-radius: 40px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="client" class="panel active">
        <h2 style="color:var(--gold); text-align:center;">VOGUE 造型範本</h2>
        <div class="sample-scroll">
            <img src="https://images.unsplash.com/photo-1560869713-7d0a294308ed?w=400" class="sample-img">
            <img src="https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400" class="sample-img">
            <img src="https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=400" class="sample-img">
        </div>

        <div class="glass-card">
            <p style="margin:0 0 15px 0; color:var(--gold);">🔍 查看我的預約進度</p>
            <input type="tel" id="trackPhone" placeholder="輸入電話號碼" oninput="renderClientTracker()">
            <div id="client-tracker-list"></div>
        </div>

        <div class="glass-card">
            <p style="margin:0 0 15px 0; color:var(--gold);">✂️ 線上預約服務</p>
            <input type="text" id="custName" placeholder="顧客姓名">
            <input type="tel" id="custPhone" placeholder="聯繫電話">
            
            <div class="service-grid">
                <div class="service-item" onclick="this.classList.toggle('selected')">洗髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">剪髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">洗加剪</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">單色染髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">漂髮設計</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">熱塑燙髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">冷塑燙髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">頭皮護理</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">髮質護理</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">造型設計</div>
            </div>

            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <span>📷 點擊上傳參考圖片</span>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="previewFile()">
                <img id="preview-img">
            </div>

            <label>點選預約日期</label>
            <input type="date" id="appDate">
            <label>點選預約時間</label>
            <input type="time" id="appTime">

            <button class="btn-action" onclick="addBooking()" style="margin-top:10px;">送出預約單</button>
        </div>
    </div>

    <div id="designer" class="panel">
        <h2 style="color:var(--gold); text-align:center;">設計師後台管理</h2>
        
        <h3 style="color:var(--status-wait); margin-left:10px;">⚠️ 待處理單 (接單/結案)</h3>
        <div id="designer-list"></div>

        <h3 style="color:var(--gold); margin-left:10px; margin-top:40px;">📁 客戶歷史歸檔 (依名歸類)</h3>
        <div id="archive-section"></div>
    </div>

    <div class="tab-switcher">
        <button class="tab-btn active" id="btn-client" onclick="switchTab('client')">客戶入口</button>
        <button class="tab-btn" id="btn-designer" onclick="switchTab('designer')">設計師端</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
            authDomain: "holyhairsalon-f73bf.firebaseapp.com",
            databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
            projectId: "holyhairsalon-f73bf"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bookingRef = ref(db, 'vogue_bookings');

        let allData = {};
        let currentImg = "";

        // 圖片預覽
        window.previewFile = () => {
            const file = document.getElementById('fileInput').files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                currentImg = reader.result;
                document.getElementById('preview-img').src = currentImg;
                document.getElementById('preview-img').style.display = 'block';
            }
            if(file) reader.readAsDataURL(file);
        };

        // 切換面板
        window.switchTab = (t) => {
            if(t === 'designer' && prompt("管理碼") !== '0000') return;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        };

        // 新增預約
        window.addBooking = () => {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const date = document.getElementById('appDate').value;
            const time = document.getElementById('appTime').value;
            const services = Array.from(document.querySelectorAll('.service-item.selected')).map(el => el.innerText);
            if(!name || !phone || !date || !time) return alert("請填寫完整資訊並選擇時間");

            push(bookingRef, {
                name, phone, date, time, services,
                img: currentImg, status: "待接單", ts: Date.now()
            });
            alert("預約成功！請輸入電話追蹤進度。");
            location.reload();
        };

        // 處理訂單與 60 天提醒
        window.processOrder = (key, status) => {
            const order = allData[key];
            if(status === '已完成') {
                const nextDate = new Date(order.date);
                nextDate.setDate(nextDate.getDate() + 60);
                push(bookingRef, {
                    name: order.name, phone: order.phone, services: ["(系統提醒：回訪建議)"],
                    date: nextDate.toISOString().split('T')[0], time: "10:00",
                    status: "系統提醒", ts: Date.now()
                });
                alert("已結案！系統已自動排定 60 天後提醒回訪。");
            }
            update(ref(db, `vogue_bookings/${key}`), { status: status });
        };

        onValue(bookingRef, (snap) => {
            allData = snap.val() || {};
            renderClientTracker();
            renderDesigner();
        });

        // 客戶進度追蹤
        window.renderClientTracker = () => {
            const phone = document.getElementById('trackPhone').value;
            const list = document.getElementById('client-tracker-list');
            list.innerHTML = "";
            if(phone.length < 4) return;
            Object.values(allData).reverse().forEach(b => {
                if(b.phone === phone) {
                    let color = b.status === '待接單' ? 'tag-wait' : (b.status === '已接單' ? 'tag-ready' : 'tag-auto');
                    list.innerHTML += `
                        <div style="padding:10px; border-bottom:1px solid #222;">
                            <b>${b.date} ${b.time}</b> <span class="status-badge ${color}">${b.status}</span><br>
                            <small>${b.services?.join(',')}</small>
                        </div>`;
                }
            });
        };

        // 設計師面板與抽屜歸檔
        function renderDesigner() {
            const list = document.getElementById('designer-list');
            const archive = document.getElementById('archive-section');
            list.innerHTML = ""; archive.innerHTML = "";
            const groups = {};

            Object.keys(allData).reverse().forEach(key => {
                const b = allData[key];
                if(b.status !== '已完成') {
                    let isRemind = b.status === '系統提醒';
                    list.innerHTML += `
                        <div class="history-item" style="border-left-color:${isRemind ? '#00d4ff':'#ff4d4d'}">
                            <b>${b.name}</b> (${b.phone}) <span class="status-badge ${isRemind?'tag-auto':'tag-wait'}">${b.status}</span><br>
                            <small>📅 ${b.date} ${b.time} / 項目：${b.services?.join(',')}</small><br>
                            ${b.img ? `<img src="${b.img}" class="booking-img" onclick="window.open(this.src)">` : ''}
                            <div style="margin-top:10px;">
                                ${b.status==='待接單' ? `<button class="btn-action" style="padding:8px" onclick="processOrder('${key}','已接單')">確認接單</button>` : ''}
                                ${b.status==='已接單' ? `<button class="btn-action" style="background:#00ff00; padding:8px" onclick="processOrder('${key}','已完成')">完成服務並歸檔</button>` : ''}
                            </div>
                        </div>`;
                } else {
                    if(!groups[b.name]) groups[b.name] = [];
                    groups[b.name].push(b);
                }
            });

            for(let name in groups) {
                const history = groups[name].map(h => `<div style="padding:5px 0; border-bottom:1px solid #222;">📅 ${h.date} - ${h.services?.join(',')}</div>`).join('');
                archive.innerHTML += `
                    <div class="drawer-box">
                        <button class="drawer-btn" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                            <span>👤 ${name}</span> <span>${groups[name].length}次 ▾</span>
                        </button>
                        <div class="drawer-content">${history}</div>
                    </div>`;
            }
        }
    </script>
</body>
</html>
