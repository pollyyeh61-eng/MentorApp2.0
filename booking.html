<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOGUE 獲利機器 - 全功能終極版</title>
    <style>
        :root {
            --dark-bg: #000; --gold: #d4af37; --gold-dim: rgba(212, 175, 55, 0.1);
            --font-main: 18px; --font-large: 20px;
            --status-wait: #ff4d4d; --status-ready: #00ff00; --status-auto: #00d4ff;
        }
        body {
            background: var(--dark-bg); color: #fff; font-family: 'PingFang TC', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px;
            font-size: var(--font-main);
        }
        .panel { display: none; width: 92%; max-width: 420px; padding-top: 20px; }
        .panel.active { display: block; }

        /* 卡片與輸入 */
        .glass-card { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 12px; background: #080808; border: 1.5px solid #222; border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        
        /* 服務項目網格 */
        .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .service-item { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px 5px; font-size: 16px; text-align: center; cursor: pointer; color: #888; }
        .service-item.selected { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

        /* 客戶端叮嚀區塊 */
        .thanks-note { background: var(--gold-dim); border: 1px solid var(--gold); border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 15px; color: var(--gold); line-height: 1.5; }
        .thanks-note::before { content: "💬 設計師叮嚀："; display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; }

        /* 按鈕樣式 */
        .btn-action { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: var(--font-main); font-weight: bold; cursor: pointer; background: var(--gold); color: #000; margin-top: 5px; }
        .btn-cancel { background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 10px !important; font-size: 14px; margin-top: 10px; }
        
        /* 狀態標籤 */
        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: bold; }
        .tag-wait { background: var(--status-wait); color: #fff; }
        .tag-ready { background: var(--status-ready); color: #000; }
        .tag-auto { background: var(--status-auto); color: #000; }

        .history-item { background: rgba(255,255,255,0.04); padding: 15px; border-radius: 18px; margin-bottom: 12px; border-left: 5px solid var(--gold); }
        .booking-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-top: 8px; border: 1px solid #444; }

        /* 設計師端抽屜 */
        .drawer-box { background: #111; border-radius: 15px; margin-bottom: 10px; overflow: hidden; border: 1px solid #222; }
        .drawer-btn { width: 100%; padding: 15px; background: #1a1a1a; border: none; color: var(--gold); display: flex; justify-content: space-between; font-size: 18px; cursor: pointer; }
        .drawer-content { display: none; padding: 15px; background: #000; }

        /* 底部切換 */
        .tab-switcher { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; background: #111; border-radius: 50px; padding: 5px; border: 1px solid #333; z-index: 1000; }
        .tab-btn { padding: 12px 25px; border: none; background: transparent; color: #666; font-size: 14px; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: #000; border-radius: 40px; font-weight: bold; }

        /* 日曆區塊樣式 */
        .calendar-section { margin-bottom: 30px; background: #0a0a0a; border-radius: 15px; padding: 10px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="client" class="panel active">
        <h2 style="color:var(--gold); text-align:center;">VOGUE 客戶預約</h2>
        
        <div class="glass-card">
            <p style="margin:0 0 10px 0; color:var(--gold);">🔍 輸入電話查詢進度與叮嚀</p>
            <input type="tel" id="trackPhone" placeholder="您的聯絡電話" oninput="renderClientTracker()">
            <div id="client-tracker-list"></div>
        </div>

        <div class="glass-card">
            <p style="margin:0 0 10px 0; color:var(--gold);">✂️ 線上快速預約</p>
            <input type="text" id="custName" placeholder="顧客姓名">
            <input type="tel" id="custPhone" placeholder="聯繫電話">
            <div class="service-grid">
                <div class="service-item" onclick="this.classList.toggle('selected')">洗髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">剪髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">洗加剪</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">單色染髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">漂髮設計</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">熱塑燙髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">冷塑燙髮</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">頭皮護理</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">髮質護理</div>
                <div class="service-item" onclick="this.classList.toggle('selected')">造型設計</div>
            </div>
            <label style="font-size:14px; color:#666;">預約日期</label>
            <input type="date" id="appDate">
            <label style="font-size:14px; color:#666;">預約時間</label>
            <input type="time" id="appTime">
            <button class="btn-action" onclick="addBooking()">確認送出預約</button>
        </div>
    </div>

    <div id="designer" class="panel">
        <h2 style="color:var(--gold); text-align:center;">VOGUE 管理後台</h2>
        
        <div class="calendar-section">
            <p style="color:var(--gold); margin:5px 0;">📅 日曆檢索 (查看特定日預約)</p>
            <input type="date" id="calFilter" onchange="renderDesigner()">
        </div>

        <h3 style="color:var(--status-wait); margin-left:10px;">⚠️ 待處理單 (待接單/已接單)</h3>
        <div id="designer-list"></div>

        <h3 style="color:var(--gold); margin-left:10px; margin-top:40px;">📁 歷史歸檔抽屜</h3>
        <div id="archive-section"></div>
    </div>

    <div class="tab-switcher">
        <button class="tab-btn active" id="btn-client" onclick="switchTab('client')">客戶端</button>
        <button class="tab-btn" id="btn-designer" onclick="switchTab('designer')">設計師端</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
            authDomain: "holyhairsalon-f73bf.firebaseapp.com",
            databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
            projectId: "holyhairsalon-f73bf"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bookingRef = ref(db, 'vogue_bookings');

        let allData = {};

        window.switchTab = (t) => {
            if(t === 'designer' && prompt("請輸入管理代碼") !== '0000') return;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        };

        window.addBooking = () => {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const date = document.getElementById('appDate').value;
            const time = document.getElementById('appTime').value;
            const services = Array.from(document.querySelectorAll('.service-item.selected')).map(el => el.innerText);
            if(!name || !phone || !date) return alert("資訊未填全");

            push(bookingRef, { name, phone, date, time, services, status: "待接單", note: "", ts: Date.now() });
            alert("預約已送出！");
        };

        // 核心邏輯：結案服務、叮嚀同步、60天自動提醒
        window.completeOrder = (key) => {
            const noteText = document.getElementById(`note-${key}`).value;
            const order = allData[key];
            const next60Days = new Date(order.date);
            next60Days.setDate(next60Days.getDate() + 60);

            // 1. 本單狀態改為已完成並存入叮嚀
            update(ref(db, `vogue_bookings/${key}`), { status: "已完成", note: noteText });

            // 2. 自動產生 60 天後的提醒單
            push(bookingRef, {
                name: order.name, phone: order.phone, services: ["(回訪建議提醒)"],
                date: next60Days.toISOString().split('T')[0], time: "10:00",
                status: "系統提醒", note: "該提醒客人回來服務了！", ts: Date.now()
            });
            alert("服務結案！已排定60天後提醒。");
        };

        window.cancelOrder = (key) => {
            if(confirm("確定取消這筆預約嗎？")) update(ref(db, `vogue_bookings/${key}`), { status: "已取消" });
        };

        onValue(bookingRef, (snap) => {
            allData = snap.val() || {};
            renderClientTracker();
            renderDesigner();
        });

        window.renderClientTracker = () => {
            const phone = document.getElementById('trackPhone').value;
            const list = document.getElementById('client-tracker-list');
            list.innerHTML = "";
            if(phone.length < 4) return;
            Object.values(allData).reverse().forEach(b => {
                if(b.phone === phone && b.status !== '已取消') {
                    let badgeClass = b.status === '待接單' ? 'tag-wait' : (b.status === '已接單' ? 'tag-ready' : 'tag-auto');
                    list.innerHTML += `
                        <div style="padding:15px; border-bottom:1px solid #222;">
                            <b>${b.date} ${b.time}</b> <span class="status-badge ${badgeClass}">${b.status}</span><br>
                            <small>${b.services?.join(',')}</small>
                            ${b.note ? `<div class="thanks-note">${b.note}</div>` : ''}
                        </div>`;
                }
            });
        };

        function renderDesigner() {
            const list = document.getElementById('designer-list');
            const archive = document.getElementById('archive-section');
            const calVal = document.getElementById('calFilter').value;
            list.innerHTML = ""; archive.innerHTML = "";
            const groups = {};

            Object.keys(allData).reverse().forEach(key => {
                const b = allData[key];
                
                // 只有「非完成」且「非取消」的單子會顯示在待處理區
                if(b.status !== '已完成' && b.status !== '已取消') {
                    // 如果有選日期日曆，則只過濾該日
                    if(calVal && b.date !== calVal) return;

                    let isAuto = b.status === '系統提醒';
                    list.innerHTML += `
                        <div class="history-item" style="border-left-color:${isAuto?'#00d4ff':'var(--gold)'}">
                            <b>${b.name}</b> (${b.phone}) <span class="status-badge ${isAuto?'tag-auto':(b.status==='待接單'?'tag-wait':'tag-ready')}">${b.status}</span><br>
                            <small>📅 ${b.date} / ⏰ ${b.time}</small><br>
                            <small>項目：${b.services?.join(',')}</small>
                            <div style="margin-top:10px;">
                                ${b.status==='待接單' ? `<button class="btn-action" onclick="update(ref(db, 'vogue_bookings/${key}'), {status:'已接單'})">確認接單</button>` : ''}
                                ${b.status==='已接單' ? `
                                    <textarea id="note-${key}" placeholder="寫下給客人的感謝叮嚀..."></textarea>
                                    <button class="btn-action" style="background:#00ff00" onclick="completeOrder('${key}')">服務完成(存叮嚀並排提醒)</button>
                                ` : ''}
                                <button class="btn-action btn-cancel" onclick="cancelOrder('${key}')">取消預約</button>
                            </div>
                        </div>`;
                } else if(b.status === '已完成') {
                    // 歸檔到抽屜
                    if(!groups[b.name]) groups[b.name] = [];
                    groups[b.name].push(b);
                }
            });

            // 渲染抽屜
            for(let name in groups) {
                const historyHtml = groups[name].map(h => `<div style="padding:8px 0; border-bottom:1px solid #222; font-size:14px;">📅 ${h.date} - ${h.services?.join(',')}</div>`).join('');
                archive.innerHTML += `
                    <div class="drawer-box">
                        <button class="drawer-btn" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                            <span>👤 ${name}</span> <span>${groups[name].length}次 ▾</span>
                        </button>
                        <div class="drawer-content">${historyHtml}</div>
                    </div>`;
            }
        }
    </script>
</body>
</html>
