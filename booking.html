<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOGUE 美業系統 - 獲利機器整合版</title>
    <style>
        :root {
            --dark-bg: #0a0a0a;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --gold-bright: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --status-wait: #ff4d4d;
            --status-done: #00ff00;
            --status-auto: #00d4ff;
            /* 根據您的需求：字體尺寸以黃金比例 18-20px 為主 */
            --font-main: 18px;
            --font-title: 20px;
        }

        body {
            background-color: var(--dark-bg); color: #fff;
            font-family: 'PingFang TC', sans-serif; margin: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 120px;
            font-size: var(--font-main);
        }

        .home-btn {
            position: fixed; top: 15px; left: 15px; z-index: 10000;
            background: #000; border: 2px solid var(--gold-bright);
            color: var(--gold-bright); padding: 10px 18px;
            border-radius: 12px; font-size: 14px; font-weight: bold;
            cursor: pointer; display: none;
        }

        .panel { display: none; width: 92%; max-width: 420px; padding-top: 65px; }
        .panel.active { display: block; }

        .glass-card { background: linear-gradient(145deg, #111, #000); border: 1px solid var(--gold-dim); border-radius: 24px; padding: 22px; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        
        h1, h2 { font-size: var(--font-title); letter-spacing: 5px; color: var(--gold-bright); text-align: center; }

        select, input { width: 100%; padding: 15px; margin-bottom: 12px; background: #080808; border: 1.5px solid #222; border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        
        .btn-action { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: var(--font-main); font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-gold { background: var(--gold-bright); color: #000; }
        .btn-outline { background: transparent; border: 1.8px solid var(--gold-bright); color: var(--gold-bright); }
        .btn-complete { background: var(--status-done); color: #000; }

        /* 抽屜式歸檔樣式 */
        .drawer { margin-top: 15px; border: 1px solid #333; border-radius: 15px; overflow: hidden; width: 100%; background: #111; }
        .drawer-header { background: #1a1a1a; padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--gold-bright); }
        .drawer-content { display: none; background: #000; padding: 10px; max-height: 400px; overflow-y: auto; }
        .drawer.open .drawer-content { display: block; }

        .client-group { margin-bottom: 8px; border: 1px solid #222; border-radius: 10px; overflow: hidden; }
        .client-group-header { padding: 12px; background: #161616; display: flex; justify-content: space-between; font-size: 16px; cursor: pointer; }
        .client-history-list { display: none; background: #050505; padding: 10px; font-size: 14px; color: #aaa; }

        .history-item { background: rgba(255,255,255,0.04); padding: 15px; border-radius: 18px; margin-bottom: 12px; border-left: 4px solid var(--gold-bright); position: relative; }
        
        .tab-switcher { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; background: #111; border-radius: 50px; padding: 5px; width: 260px; border: 1px solid #333; z-index: 1000; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #666; font-size: 14px; cursor: pointer; }
        .tab-btn.active { background: var(--gold-bright); color: #000; border-radius: 40px; font-weight: bold; }

        .status-badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid currentColor; margin-left: 5px; }
    </style>
</head>
<body>

    <button id="main-home-btn" class="home-btn" onclick="window.location.href='index.html'">🏠 返回首頁</button>

    <div id="client" class="panel active">
        <h1>VOGUE 預約</h1>
        <div class="glass-card">
            <input type="text" id="custName" placeholder="您的姓名">
            <input type="tel" id="custPhone" placeholder="聯繫電話">
            <select id="selService">
                <option value="洗剪髮">洗剪髮</option>
                <option value="染髮設計">染髮設計</option>
                <option value="燙髮設計">燙髮設計</option>
                <option value="頭皮護理">頭皮護理</option>
            </select>
            <div style="display:flex; gap:10px;">
                <input type="date" id="appDate" style="flex:1">
                <input type="time" id="appTime" style="flex:1">
            </div>
            <button class="btn-action btn-outline" onclick="addBooking()">立即預約服務</button>
        </div>
        <h3 style="color:var(--gold-bright); font-size:18px;">我的預約狀態</h3>
        <div id="my-list"></div>
    </div>

    <div id="designer" class="panel">
        <h2>設計師管理後台</h2>
        
        <h3 style="color:var(--status-wait); font-size:18px; margin-left:10px;">⚠️ 待處理清單 (接單/結案)</h3>
        <div id="designer-pending"></div>

        <div class="drawer" id="archive-drawer">
            <div class="drawer-header" onclick="this.parentElement.classList.toggle('open')">
                <span>📁 客戶歷史檔案 (依名歸檔)</span>
                <span style="font-size:12px;">點擊展開 ▾</span>
            </div>
            <div class="drawer-content" id="archive-content">
                </div>
        </div>
    </div>

    <div class="tab-switcher">
        <button class="tab-btn active" id="btn-client" onclick="switchTab('client')">客戶入口</button>
        <button class="tab-btn" id="btn-designer" onclick="switchTab('designer')">設計師後台</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCOhBN9TH3UJSOSx5XVyQ08f_2RUckvXYU",
            authDomain: "holyhairsalon-f73bf.firebaseapp.com",
            databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
            projectId: "holyhairsalon-f73bf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const bookingRef = ref(db, 'vogue_bookings');

        let allBookings = {};

        window.switchTab = (t) => {
            if(t === 'designer') {
                if(prompt("請輸入管理代碼") !== '0000') return;
                document.getElementById('main-home-btn').style.display = 'block';
            } else {
                document.getElementById('main-home-btn').style.display = 'none';
            }
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        };

        window.addBooking = () => {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const date = document.getElementById('appDate').value;
            const time = document.getElementById('appTime').value;
            const service = document.getElementById('selService').value;
            if(!name || !phone || !date) return alert("請完整填寫預約資訊");

            push(bookingRef, {
                name, phone, date, time, service,
                status: "待接單",
                timestamp: Date.now()
            }).then(() => alert("預約成功！"));
        };

        // 核心邏輯：處理訂單與自動化追蹤
        window.updateStatus = (key, nextStatus) => {
            const order = allBookings[key];
            
            if(nextStatus === '已完成') {
                // 1. 執行「美髮學堂」經營策略：自動生成 60 天後提醒
                const futureDate = new Date(order.date);
                futureDate.setDate(futureDate.getDate() + 60);
                
                push(bookingRef, {
                    name: order.name,
                    phone: order.phone,
                    service: order.service + "(回訪提醒)",
                    date: futureDate.toISOString().split('T')[0],
                    time: order.time,
                    status: "系統提醒",
                    timestamp: Date.now()
                });
                alert("結案成功！系統已為您在 60 天後預排追蹤單。");
            }
            
            update(ref(db, `vogue_bookings/${key}`), { status: nextStatus });
        };

        onValue(bookingRef, (snap) => {
            allBookings = snap.val() || {};
            renderClientList();
            renderDesignerPanel();
        });

        function renderClientList() {
            const myList = document.getElementById('my-list');
            const phone = document.getElementById('custPhone').value;
            myList.innerHTML = "";
            if(!phone) return;
            Object.values(allBookings).reverse().forEach(b => {
                if(b.phone === phone && b.status !== '系統提醒') {
                    myList.innerHTML += `
                        <div class="history-item">
                            <b>${b.service}</b> <span class="status-badge">${b.status}</span><br>
                            <small>${b.date} ${b.time}</small>
                        </div>`;
                }
            });
        }

        function renderDesignerPanel() {
            const pendingDiv = document.getElementById('designer-pending');
            const archiveDiv = document.getElementById('archive-content');
            pendingDiv.innerHTML = "";
            archiveDiv.innerHTML = "";

            const groups = {}; // 用於歷史歸檔群組

            Object.keys(allBookings).sort((a,b) => allBookings[b].timestamp - allBookings[a].timestamp).forEach(key => {
                const b = allBookings[key];

                // 待處理區 (待接單、已接單、系統提醒)
                if(b.status !== '已完成') {
                    const isAuto = b.status === '系統提醒';
                    pendingDiv.innerHTML += `
                        <div class="history-item" style="border-left-color:${isAuto ? '#00d4ff':'#ff4d4d'}">
                            <div style="display:flex; justify-content:space-between;">
                                <b>${b.name}</b>
                                <span style="color:${isAuto?'#00d4ff':'#ff4d4d'}">${b.status}</span>
                            </div>
                            <div style="font-size:15px; margin:5px 0;">項目：${b.service}</div>
                            <small>${b.date} ${b.time} / ${b.phone}</small>
                            ${b.status === '待接單' ? `<button class="btn-action btn-gold" onclick="updateStatus('${key}','已接單')">確認接單</button>` : ''}
                            ${b.status === '已接單' ? `<button class="btn-action btn-complete" onclick="updateStatus('${key}','已完成')">完成服務 (啟動60天追蹤)</button>` : ''}
                        </div>`;
                }

                // 歸檔區 (已完成)
                if(b.status === '已完成') {
                    if(!groups[b.name]) groups[b.name] = [];
                    groups[b.name].push(b);
                }
            });

            // 渲染歸檔抽屜內的小抽屜
            for(let name in groups) {
                const historyHtml = groups[name].map(h => `<div>📅 ${h.date} - ${h.service}</div>`).join('');
                archiveDiv.innerHTML += `
                    <div class="client-group">
                        <div class="client-group-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
                            <span>👤 ${name}</span>
                            <span>${groups[name].length} 次消費 ▾</span>
                        </div>
                        <div class="client-history-list">${historyHtml}</div>
                    </div>`;
            }
        }
    </script>
</body>
</html>
