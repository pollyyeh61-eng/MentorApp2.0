<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美髮經營學-正式線上課程 | trial2</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #121212;
            --gold-dim: #8a6d3b;
            --gold-bright: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-gold: #c5a059;
            --text-silver: #a0a0a0;
        }

        body {
            font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            margin: 0;
            background-color: var(--bg-color);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 導航列與按鈕樣式 (同 index.html 風格) */
        .auth-bar {
            width: 100%; display: flex; justify-content: flex-end;
            padding: 15px 25px; gap: 10px; position: fixed; top: 0; z-index: 200;
        }

        .auth-btn {
            background: rgba(20,20,20,0.8); border: 1px solid var(--gold-dim);
            color: var(--text-gold); padding: 6px 15px; border-radius: 20px;
            cursor: pointer; font-size: 0.85rem; transition: 0.3s;
        }

        .side-nav {
            position: fixed; left: 15px; top: 60%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
        }

        .nav-icon-btn {
            width: 45px; height: 45px; background: rgba(20,20,20,0.9);
            border: 1px solid var(--gold-dim); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; text-decoration: none; font-size: 18px;
        }

        .nav-icon-btn:hover { background: var(--gold-bright); transform: scale(1.1); }

        /* 主容器 */
        .container {
            width: 900px; max-width: 92%; padding: 40px 20px; box-sizing: border-box;
            background: var(--container-bg); border: 2px solid var(--gold-dim); 
            position: relative; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9); margin-top: 60px;
        }

        /* 內容區塊與網格 */
        .management-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; padding: 25px 0; }
        .block {
            padding: 15px; border-radius: 8px; text-align: center;
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--gold-dim);
            transition: 0.4s; cursor: pointer;
        }
        .block:hover { border-color: var(--gold-bright); background: rgba(212, 175, 55, 0.08); }
        .main-title { font-size: 16px; font-weight: bold; color: var(--gold-bright); margin-bottom: 10px; border-bottom: 1px solid #333; }
        .sub-items { list-style: none; padding: 0; text-align: left; }
        .sub-items li { margin-bottom: 8px; font-size: 13px; color: var(--text-silver); cursor: pointer; padding: 4px 8px; }
        .sub-items li:hover { color: var(--gold-bright); background: rgba(212, 175, 55, 0.15); }

        /* 外部連結文字標籤 */
        .external-link-text { position: absolute; font-size: 16px; font-weight: bold; color: var(--gold-dim); writing-mode: vertical-rl; cursor: pointer; }
        .text-management { top: 50%; left: -30px; transform: translateY(-50%); }
        .text-preface { top: 50%; left: -55px; transform: translateY(-50%); }
        .text-holding { top: 50%; right: -55px; transform: translateY(-50%); }
        .top-bottom-mgt-text { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: bold; color: var(--gold-dim); cursor: pointer; }
        .text-top-mgt { top: 8px; } .text-cost-mgt { bottom: 8px; }

        /* 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #151515; border: 1px solid var(--gold-bright); padding: 25px; border-radius: 15px; width: 320px; }
    </style>
</head>
<body>

    <div class="auth-bar" id="auth-bar">
        <button class="auth-btn" onclick="openAuthModal()">登入學堂</button>
    </div>

    <div class="side-nav">
        <div class="nav-icon-btn" onclick="location.href='index.html'" title="返回助理首頁">🏠</div>
        <div class="nav-icon-btn" onclick="location.href='pos.html'" title="銷售收銀">💰</div>
        <div class="nav-icon-btn" onclick="location.href='customer.html'" title="客戶管理">💎</div>
        <div class="nav-icon-btn" onclick="location.href='store.html'" title="庫存管理">📦</div>
        <div class="nav-icon-btn" onclick="location.href='student.html'" title="學員專區">🎓</div>
    </div>

    <div class="container">
        <div class="external-link-text text-preface" onclick="navTo('total-preface')">前言</div>
        <div class="external-link-text text-management" onclick="navTo('total-management')">管理層</div>
        <div class="external-link-text text-holding" onclick="navTo('total-holding-label')">控股層</div>
        <div class="top-bottom-mgt-text text-top-mgt" onclick="navTo('top-price-mgt')">價格管理</div>
        <div class="top-bottom-mgt-text text-cost-mgt" onclick="navTo('bottom-cost-mgt')">成本管理</div>
        
        <div class="management-grid">
            <div class="block" onclick="navTo('left-external')">
                <div class="main-title">左外部管理</div>
                <ul class="sub-items"><li onclick="event.stopPropagation(); navTo('supplier-mgt')">供應商協作</li></ul>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div class="block" onclick="navTo('top-external-overview')">
                    <div class="main-title">上外部管理</div>
                    <ul class="sub-items">
                        <li onclick="event.stopPropagation(); navTo('customer-mgt')">1. 顧客管理系統</li>
                        <li onclick="event.stopPropagation(); navTo('sentiment-mgt')">2. 客情分析報告</li>
                        <li onclick="event.stopPropagation(); navTo('booking-mgt')">3. 預約管理課程</li>
                    </ul>
                </div>
                <div class="block" onclick="navTo('internal-operations-overview')">
                    <div class="main-title">核心內部管理</div>
                    <ul class="sub-items">
                        <li onclick="event.stopPropagation(); navTo('financial-mgt')">1. 財務收銀系統</li>
                        <li onclick="event.stopPropagation(); navTo('talent-mgt')">2. 人才訓練系統</li>
                        <li onclick="event.stopPropagation(); navTo('inventory-mgt')">3. 庫存金庫系統</li>
                    </ul>
                </div>
                <div class="block" onclick="navTo('bottom-external-overview')">
                    <div class="main-title">下外部管理</div>
                    <ul class="sub-items">
                        <li onclick="event.stopPropagation(); navTo('marketing-mgt')">1. 行銷漏斗策略</li>
                        <li onclick="event.stopPropagation(); navTo('activity-mgt')">2. 活動管理實務</li>
                        <li onclick="event.stopPropagation(); navTo('community-mgt')">3. 社區美感經營</li>
                    </ul>
                </div>
            </div>
            <div class="block" onclick="navTo('right-external')">
                <div class="main-title">右外部管理</div>
                <ul class="sub-items"><li onclick="event.stopPropagation(); navTo('brand-mgt')">品牌視覺資產</li></ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyAM4d9GqtSjNOlfguew8BktZ8ptrnBzvpc", authDomain: "mentor-app-b76e3.firebaseapp.com", projectId: "mentor-app-b76e3", appId: "1:757249551762:web:512533e0a85dc1ad47654b" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            window.isLoggedIn = !!user;
            document.getElementById('auth-bar').innerHTML = user ? 
                `<button class="auth-btn" onclick="location.href='index.html'">👤 返回個人中心</button>` : 
                `<button class="auth-btn" onclick="alert('請回首頁登入')">登入學堂</button>`;
        });
    </script>

    <script>
        // 修正後的連結對照表 (對應您的原版內容)
        const linkUrls = {
            'top-price-mgt': 'https://sites.google.com/view/webcourse001/%E5%83%B9%E6%A0%BC%E7%AE%A1%E7%90%86',
            'bottom-cost-mgt': 'https://drive.google.com/file/d/14qUKcjBlMhrGQpNFsb5CUxfUWHeBagkP/view?usp=sharing',
            'total-preface': 'https://sites.google.com/view/webcourse001/%E5%89%8D%E8%A8%80/',
            'total-management': 'https://drive.google.com/file/d/1OFOMi1jE9KRMp2eHoL1T4eeGUm3peq9g/view?usp=sharing',
            'total-holding-label': 'https://drive.google.com/file/d/19jz8RCEfCmmBI_ki8mlXP0BeEa7NIM14/view?usp=sharing',
            'top-external-overview': 'https://drive.google.com/file/d/1cFAh4to7Jyau-JrV75RzHXexsyTGuePA/view?usp=sharing',
            'internal-operations-overview': 'https://drive.google.com/file/d/1WqYvrwuDqktlYV94Blb3ETpxL5rJ4cG5/view?usp=sharing',
            'bottom-external-overview': 'https://drive.google.com/file/d/1T6i6smjMgfm40HrLm3zzoC5FrTuOCTbG/view?usp=sharing',
            'left-external': 'https://drive.google.com/file/d/1DaYJLu4EH68bJcOUMOY46Tem85JxRByF/view?usp=drive_link',
            'right-external': 'https://drive.google.com/file/d/1MU1Z2cH0L5sNmV-TqaWWp9zUvRiDoxyV/view?usp=drive_link',
            'customer-mgt': 'https://sites.google.com/view/webcourse001/%E9%A1%A7%E5%AE%A2%E7%AE%A1%E7%90%86',
            'sentiment-mgt': 'https://sites.google.com/view/webcourse001/%E5%AE%A2%E6%83%85%E7%AE%A1%E7%90%86',
            'booking-mgt': 'https://sites.google.com/view/webcourse001/%E9%A0%90%E7%B4%84%E7%AE%A1%E7%90%86',
            'financial-mgt': 'https://sites.google.com/view/webcourse001/%E8%B2%A1%E5%8B%99%E7%AE%A1%E7%90%86',
            'talent-mgt': 'https://sites.google.com/view/webcourse001/%E4%BA%BA%E6%89%8D%E7%AE%A1%E7%90%86',
            'inventory-mgt': 'https://sites.google.com/view/webcourse001/%E5%BA%AB%E5%AD%98%E7%AE%A1%E7%90%86',
            'marketing-mgt': 'https://sites.google.com/view/webcourse001/%E8%A1%8C%E9%8A%B7%E7%AE%A1%E7%90%86',
            'activity-mgt': 'https://sites.google.com/view/webcourse001/%E6%B4%BB%E5%8B%95%E7%AE%A1%E7%90%86',
            'community-mgt': 'https://sites.google.com/view/webcourse001/%E7%A4%BE%E5%8D%80%E7%AE%A1%E7%90%86',
            'supplier-mgt': 'https://sites.google.com/view/webcourse001/%E4%BE%9B%E6%87%89%E5%95%86%E7%AE%A1%E7%90%86',
            'brand-mgt': 'https://sites.google.com/view/webcourse001/%E5%93%81%E7%89%8C%E7%AE%A1%E7%90%86',
        };

        window.navTo = function(key) {
            if (!window.isLoggedIn) {
                alert("請先返回首頁登入學員帳號。");
                location.href = 'index.html';
                return;
            }
            const url = linkUrls[key];
            if (url) window.open(url, '_blank');
        };
    </script>
</body>
</html>
