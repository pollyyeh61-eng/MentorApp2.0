<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE Salon | 數位經營總部</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #121212;
            --gold-dim: #8a6d3b;
            --gold-bright: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-gold: #c5a059;
            --text-silver: #a0a0a0;
        }

        body {
            font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            margin: 0;
            background-color: var(--bg-color);
            color: #ffffff;
            overflow: hidden;
        }

        /* 背景掃描線特效 */
        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
            animation: scan 8s linear infinite;
            opacity: 0.2;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* 左側系統導航列 */
        .side-nav {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }
        .nav-icon-btn {
            width: 50px; height: 50px;
            background: rgba(20,20,20,0.8);
            border: 1px solid var(--gold-dim);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .nav-icon-btn:hover {
            border-color: var(--gold-bright);
            background: var(--gold-bright);
            transform: translateX(10px);
        }
        .nav-icon-btn::after {
            content: attr(data-label);
            position: absolute;
            left: 60px;
            background: var(--gold-bright);
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            white-space: nowrap;
        }
        .nav-icon-btn:hover::after { opacity: 1; transform: translateX(5px); }

        @keyframes breath {
            0% { border-color: var(--gold-dim); box-shadow: 0 0 5px rgba(138, 109, 59, 0.2); }
            50% { border-color: var(--gold-bright); box-shadow: 0 0 20px var(--gold-glow); }
            100% { border-color: var(--gold-dim); box-shadow: 0 0 5px rgba(138, 109, 59, 0.2); }
        }

        .container {
            width: 900px;
            max-width: 95%;
            padding: 30px 20px; 
            box-sizing: border-box;
            background: var(--container-bg);
            border: 2px solid var(--gold-dim); 
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* 外部連結文字樣式 */
        .external-link-text {
            position: absolute; font-size: 18px; font-weight: bold;
            color: var(--gold-dim); writing-mode: vertical-rl; 
            text-orientation: upright; cursor: pointer; transition: all 0.4s ease;
        }
        .external-link-text:hover { color: var(--gold-bright); text-shadow: 0 0 10px var(--gold-bright); }
        
        .text-management { top: 50%; left: -35px; transform: translateY(-50%); }
        .text-preface { top: 50%; left: -65px; transform: translateY(-50%); }
        .text-holding { top: 50%; right: -65px; transform: translateY(-50%); } 

        .top-bottom-mgt-text {
            position: absolute; left: 50%; transform: translateX(-50%); 
            font-size: 20px; font-weight: bold; color: var(--gold-dim); 
            cursor: pointer; transition: all 0.4s ease; text-align: center;
        }
        .text-top-mgt { top: 0; padding-top: 5px; } 
        .text-cost-mgt { bottom: 0; padding-bottom: 5px; } 

        .management-grid {
            display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 15px;
            padding: 30px 0; position: relative; border: 1px solid #333;
        }

        .block {
            padding: 15px; border-radius: 8px; text-align: center;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--gold-dim);
            transition: all 0.5s; cursor: pointer; animation: breath 4s infinite ease-in-out;
        }

        /* 各區塊 Hover 色彩 */
        .block-side:hover { border-color: #00ff88 !important; transform: scale(1.02); }
        .block-top:hover { border-color: #ffea00 !important; transform: scale(1.02); }
        .block-middle:hover { border-color: #ff9100 !important; transform: scale(1.02); }
        .block-bottom:hover { border-color: #ff0077 !important; transform: scale(1.02); }

        .sub-items { list-style: none; padding: 0; text-align: left; margin-top: 10px; }
        .sub-items li { margin-bottom: 5px; font-size: 14px; cursor: pointer; color: var(--text-silver); }
        .sub-items li:hover { color: #fff; text-decoration: underline; }

        .main-title {
            font-size: 18px; font-weight: bold; margin-bottom: 10px;
            color: var(--gold-bright); border-bottom: 1px dashed #444; padding-bottom: 5px;
        }

        .middle-content { display: flex; flex-direction: column; justify-content: space-around; gap: 15px; grid-column: 2 / 3; }
    </style>
</head>
<body>

    <div class="side-nav">
        <a href="pos.html" class="nav-icon-btn" data-label="收銀系統">💰</a>
        <a href="crm.html" class="nav-icon-btn" data-label="客戶CRM">💎</a>
        <a href="inventory.html" class="nav-icon-btn" data-label="庫存金庫">📦</a>
        <a href="status.html" class="nav-icon-btn" data-label="教育訓練">🎓</a>
    </div>

    <div class="container">
        <div class="external-link-text text-preface" data-link-id="total-preface">前言</div>
        <div class="external-link-text text-management" data-link-id="total-management">管理層</div>
        <div class="external-link-text text-holding" data-link-id="total-holding-label">控股層</div>
        
        <div class="top-bottom-mgt-text text-top-mgt" data-link-id="top-price-mgt">價格管理</div>
        <div class="top-bottom-mgt-text text-cost-mgt" data-link-id="bottom-cost-mgt">成本管理</div>
        
        <div class="management-grid">
            <div class="side-block block block-side" data-link-id="left-external">
                <div class="main-title">左外部管理</div>
                <div style="font-size: 14px; color: var(--gold-dim);">供應商協作系統</div> 
            </div>

            <div class="middle-content">
                <div class="block block-top" data-link-id="top-external-overview">
                    <div class="main-title">上外部管理</div>
                    <ul class="sub-items">
                        <li onclick="location.href='crm.html'">1. 顧客管理 (系統)</li>
                        <li data-link-id="sentiment-mgt">2. 客情分析報告</li>
                        <li data-link-id="booking-mgt">3. 線上預約中心</li>
                    </ul>
                </div>

                <div class="block block-middle" data-link-id="internal-operations-overview">
                    <div class="main-title">核心內部管理</div>
                    <ul class="sub-items">
                        <li onclick="location.href='pos.html'">1. 財務收銀 (系統)</li>
                        <li onclick="location.href='status.html'">2. 人才訓練 (系統)</li>
                        <li onclick="location.href='inventory.html'">3. 庫存金庫 (系統)</li>
                    </ul>
                </div>

                <div class="block block-bottom" data-link-id="bottom-external-overview">
                    <div class="main-title">下外部管理</div>
                    <ul class="sub-items">
                        <li data-link-id="marketing-mgt">1. 行銷漏斗策略</li>
                        <li data-link-id="activity-mgt">2. 活動促銷模組</li>
                        <li data-link-id="community-mgt">3. 社區美感經營</li>
                    </ul>
                </div>
            </div>

            <div class="side-block block block-side" data-link-id="right-external">
                <div class="main-title">右外部管理</div>
                <div style="font-size: 14px; color: var(--gold-dim);">品牌視覺資產</div>
            </div>
        </div>
    </div>

    

    <script>
        const linkUrls = {
            'top-price-mgt': 'https://sites.google.com/view/webcourse001/%E5%83%B9%E6%A0%BC%E7%AE%A1%E7%90%86',
            'bottom-cost-mgt': 'https://drive.google.com/file/d/14qUKcjBlMhrGQpNFsb5CUxfUWHeBagkP/view?usp=sharing',
            'total-preface': 'https://sites.google.com/view/webcourse001/%E5%89%8D%E8%A8%80/',
            'total-management': 'https://drive.google.com/file/d/1OFOMi1jE9KRMp2eHoL1T4eeGUm3peq9g/view?usp=sharing',
            'total-holding-label': 'https://drive.google.com/file/d/19jz8RCEfCmmBI_ki8mlXP0BeEa7NIM14/view?usp=sharing',
            'top-external-overview': 'https://drive.google.com/file/d/1cFAh4to7Jyau-JrV75RzHXexsyTGuePA/view?usp=sharing',
            'internal-operations-overview': 'https://drive.google.com/file/d/1WqYvrwuDqktlYV94Blb3ETpxL5rJ4cG5/view?usp=sharing',
            'bottom-external-overview': 'https://drive.google.com/file/d/1T6i6smjMgfm40HrLm3zzoC5FrTuOCTbG/view?usp=sharing',
            'left-external': 'https://drive.google.com/file/d/1DaYJLu4EH68bJcOUMOY46Tem85JxRByF/view?usp=drive_link',
            'right-external': 'https://drive.google.com/file/d/1MU1Z2cH0L5sNmV-TqaWWp9zUvRiDoxyV/view?usp=drive_link',
            'sentiment-mgt': 'https://sites.google.com/view/webcourse001/%E5%AE%A2%E6%83%85%E7%AE%A1%E7%90%86',
            'booking-mgt': 'https://sites.google.com/view/webcourse001/%E9%A0%90%E7%B4%84%E7%AE%A1%E7%90%86',
            'marketing-mgt': 'https://sites.google.com/view/webcourse001/%E8%A1%8C%E9%8A%B7%E7%AE%A1%E7%90%86',
            'activity-mgt': 'https://sites.google.com/view/webcourse001/%E6%B4%BB%E5%8B%95%E7%AE%A1%E7%90%86',
            'community-mgt': 'https://sites.google.com/view/webcourse001/%E7%A4%BE%E5%8D%80%E7%AE%A1%E7%90%86',
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-link-id]').forEach(element => {
                element.addEventListener('click', (e) => {
                    const url = linkUrls[element.getAttribute('data-link-id')];
                    if (url) window.open(url, '_blank');
                });
            });
        });
    </script>
</body>
</html>
